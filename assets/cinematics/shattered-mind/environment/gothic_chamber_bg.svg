<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020306"/>
      <stop offset="40%" stop-color="#070a14"/>
      <stop offset="75%" stop-color="#04060d"/>
      <stop offset="100%" stop-color="#010204"/>
    </linearGradient>
    <radialGradient id="torchGlowL" cx="280" cy="520" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="torchGlowR" cx="1640" cy="520" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalAbyss" cx="960" cy="540" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0b36" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#090314" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="vaultRib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="680" x2="0%" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="40%" stop-color="#0c101d"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <filter id="stoneRelief" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ambient Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Distant Vault Ceiling Ribs -->
  <path d="M 400 0 Q 960 480 1520 0" stroke="url(#vaultRib)" stroke-width="28" fill="none" opacity="0.6"/>
  <path d="M 200 0 Q 960 560 1720 0" stroke="url(#vaultRib)" stroke-width="36" fill="none" opacity="0.4"/>
  <path d="M 0 0 Q 960 640 1920 0" stroke="url(#vaultRib)" stroke-width="48" fill="none" opacity="0.25"/>

  <!-- Center Gothic Portal (Archway into infinite darkness) -->
  <path d="M 820 680 L 820 440 Q 960 300 1100 440 L 1100 680 Z" fill="url(#portalAbyss)" stroke="#111827" stroke-width="12"/>
  <path d="M 840 680 L 840 455 Q 960 330 1080 455 L 1080 680 Z" fill="#020204"/>

  <!-- Ancient Carved Ashlar Walls -->
  <!-- Left Wall Blocks -->
  <g opacity="0.45" stroke="#030712" stroke-width="3">
    <rect x="0" y="240" width="380" height="90" fill="#0b0f19"/>
    <rect x="380" y="240" width="340" height="90" fill="#090d16"/>
    <rect x="0" y="330" width="260" height="90" fill="#0a0e18"/>
    <rect x="260" y="330" width="460" height="90" fill="#0d121f"/>
    <rect x="0" y="420" width="420" height="90" fill="#090d16"/>
    <rect x="420" y="420" width="300" height="90" fill="#0c101d"/>
    <rect x="0" y="510" width="220" height="90" fill="#0b0f19"/>
    <rect x="220" y="510" width="500" height="90" fill="#0a0e18"/>
    <rect x="0" y="600" width="360" height="80" fill="#080c14"/>
    <rect x="360" y="600" width="360" height="80" fill="#0b0f19"/>
  </g>

  <!-- Right Wall Blocks -->
  <g opacity="0.45" stroke="#030712" stroke-width="3">
    <rect x="1200" y="240" width="360" height="90" fill="#090d16"/>
    <rect x="1560" y="240" width="360" height="90" fill="#0b0f19"/>
    <rect x="1200" y="330" width="440" height="90" fill="#0d121f"/>
    <rect x="1640" y="330" width="280" height="90" fill="#0a0e18"/>
    <rect x="1200" y="420" width="310" height="90" fill="#0c101d"/>
    <rect x="1510" y="420" width="410" height="90" fill="#090d16"/>
    <rect x="1200" y="510" width="480" height="90" fill="#0a0e18"/>
    <rect x="1680" y="510" width="240" height="90" fill="#0b0f19"/>
    <rect x="1200" y="600" width="370" height="80" fill="#0b0f19"/>
    <rect x="1570" y="600" width="350" height="80" fill="#080c14"/>
  </g>

  <!-- Massive Flagstone Floor with Perspective Grid -->
  <polygon points="0,680 1920,680 1920,1080 0,1080" fill="url(#floorGrad)"/>
  <g stroke="#03050a" stroke-width="2.5" opacity="0.7">
    <!-- Perspective depth lines radiating from vanishing point (960, 520) -->
    <line x1="960" y1="680" x2="0" y2="1080"/>
    <line x1="960" y1="680" x2="380" y2="1080"/>
    <line x1="960" y1="680" x2="720" y2="1080"/>
    <line x1="960" y1="680" x2="960" y2="1080"/>
    <line x1="960" y1="680" x2="1200" y2="1080"/>
    <line x1="960" y1="680" x2="1540" y2="1080"/>
    <line x1="960" y1="680" x2="1920" y2="1080"/>

    <!-- Transverse stone joint lines -->
    <line x1="0" y1="710" x2="1920" y2="710"/>
    <line x1="0" y1="755" x2="1920" y2="755"/>
    <line x1="0" y1="815" x2="1920" y2="815"/>
    <line x1="0" y1="895" x2="1920" y2="895"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
  </g>

  <!-- Chiaroscuro Torchlight Gradients -->
  <rect width="1920" height="1080" fill="url(#torchGlowL)"/>
  <rect width="1920" height="1080" fill="url(#torchGlowR)"/>
</svg>