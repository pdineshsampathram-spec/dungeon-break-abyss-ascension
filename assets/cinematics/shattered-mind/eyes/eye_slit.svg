<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <!-- Organic Outer Halo & Glow -->
    <radialGradient id="abyssalAura" cx="300" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#7e22ce" stop-opacity="0.30"/>
      <stop offset="75%" stop-color="#3b0764" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Sclera with Deep Organic Shading -->
    <radialGradient id="scleraGrad" cx="300" cy="180" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="40%" stop-color="#fee2e2"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="90%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <!-- Rich Iris Multi-Ring Strata (Crimson, Amber, Purple) -->
    <radialGradient id="irisRing" cx="300" cy="180" r="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="25%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="92%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#1e0509"/>
    </radialGradient>

    <!-- Pupil Void -->
    <radialGradient id="pupilVoid" cx="300" cy="180" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="85%" stop-color="#050108"/>
      <stop offset="100%" stop-color="#1a0414"/>
    </radialGradient>

    <filter id="eyelidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020408" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Volumetric Outer Halo -->
  <rect width="600" height="360" fill="url(#abyssalAura)"/>

  <!-- Organic Eye Socket (Almond Aperture) -->
  <path d="M 60 180 Q 300 145 540 180 Q 300 215 60 180 Z" fill="url(#scleraGrad)" stroke="#1e030a" stroke-width="6"/>

  <!-- Sclera Capillaries & Blood Vessels -->
  <g stroke="#b91c1c" stroke-width="1.2" opacity="0.6" fill="none">
    <path d="M 75 180 Q 140 160 210 170 M 140 160 Q 170 140 215 150"/>
    <path d="M 85 190 Q 150 200 205 185 M 130 195 Q 165 210 200 200"/>
    <path d="M 525 180 Q 460 160 390 170 M 460 160 Q 430 140 385 150"/>
    <path d="M 515 190 Q 450 200 395 185 M 470 195 Q 435 210 400 200"/>
  </g>

  <!-- Large Multi-Stratum Iris -->
  <circle cx="300" cy="180" r="100" fill="url(#irisRing)" stroke="#450a0a" stroke-width="4"/>

  <!-- Radiating Iris Striations & Fibrils -->
  <g stroke="#fde047" stroke-width="1" opacity="0.45">
    <line x1="300" y1="180" x2="300" y2="84"/><line x1="300" y1="180" x2="300" y2="276"/>
    <line x1="300" y1="180" x2="204" y2="180"/><line x1="300" y1="180" x2="396" y2="180"/>
    <line x1="300" y1="180" x2="232" y2="112"/><line x1="300" y1="180" x2="368" y2="248"/>
    <line x1="300" y1="180" x2="368" y2="112"/><line x1="300" y1="180" x2="232" y2="248"/>
    <line x1="300" y1="180" x2="265" y2="90"/><line x1="300" y1="180" x2="335" y2="270"/>
    <line x1="300" y1="180" x2="335" y2="90"/><line x1="300" y1="180" x2="265" y2="270"/>
    <line x1="300" y1="180" x2="210" y2="145"/><line x1="300" y1="180" x2="390" y2="215"/>
    <line x1="300" y1="180" x2="390" y2="145"/><line x1="300" y1="180" x2="210" y2="215"/>
  </g>

  <!-- Inner Amber Energy Ring -->
  <circle cx="300" cy="180" r="64" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.75"/>

  <!-- Supernatural Obsidian Pupil -->
  <circle cx="300" cy="180" r="24" fill="url(#pupilVoid)"/>

  <!-- Glossy Specular Wet Reflection Highlights -->
  <ellipse cx="275" cy="155" rx="16" ry="9" transform="rotate(-25 275 155)" fill="#ffffff" opacity="0.92"/>
  <circle cx="330" cy="205" r="5" fill="#ffffff" opacity="0.65"/>
  <ellipse cx="290" cy="142" rx="6" ry="3" fill="#ffffff" opacity="0.8"/>

  <!-- Upper Heavy Eyelid & Crease with Chiaroscuro Shadow -->
  <path d="M 50 180 Q 300 2 550 180 Q 300 50 50 180 Z" fill="#09050d" filter="url(#eyelidShadow)"/>
  <path d="M 70 170 Q 300 35 530 170" stroke="#2e0814" stroke-width="5" fill="none"/>

  <!-- Lower Eyelid Rim -->
  <path d="M 50 180 Q 300 358 550 180 Q 300 310 50 180 Z" fill="#09050d" filter="url(#eyelidShadow)"/>
  <path d="M 70 190 Q 300 325 530 190" stroke="#1f0a12" stroke-width="4" fill="none"/>
</svg>