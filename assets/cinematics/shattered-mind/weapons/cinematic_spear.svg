<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 650" width="200" height="650">
  <defs>
    <linearGradient id="spearTip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Long Ash Shaft -->
  <rect x="94" y="120" width="12" height="520" rx="3" fill="#451a03"/>
  <!-- Razor Leaf Blade -->
