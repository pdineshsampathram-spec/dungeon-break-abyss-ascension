  <line x1="100" y1="20" x2="100" y2="120" stroke="#f8fafc" stroke-width="2"/>
  <!-- Crossbar Guard -->
  <rect x="75" y="115" width="50" height="10" rx="2" fill="#d97706"/>
</svg>