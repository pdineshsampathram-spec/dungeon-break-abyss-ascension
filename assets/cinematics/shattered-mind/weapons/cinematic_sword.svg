<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="200" height="600">
  <defs>
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldHilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Blade -->
  <polygon points="85,120 100,500 115,120" fill="url(#bladeSteel)"/>
  <line x1="100" y1="120" x2="100" y2="490" stroke="#f8fafc" stroke-width="1.5"/>
  <!-- Glowing Runic Channel -->
  <line x1="100" y1="140" x2="100" y2="380" stroke="#38bdf8" stroke-width="3"/>
  <!-- Golden Crossguard -->
  <path d="M 30 110 Q 100 130 170 110 L 160 130 Q 100 145 40 130 Z" fill="url(#goldHilt)"/>
  <!-- Wire Wrapped Grip -->
  <rect x="92" y="30" width="16" height="80" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <!-- Pommel -->
  <circle cx="100" cy="22" r="16" fill="url(#goldHilt)"/>
  <circle cx="100" cy="22" r="6" fill="#38bdf8"/>
</svg>