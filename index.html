function tickIntroCI(dt) {
  const cam = CI.cam;
  CI.introTimer += dt;
  const t = CI.introTimer;

  // Letterbox slides in quickly
  if (CI.letterbox < 1) CI.letterbox = Math.min(1, CI.letterbox + dt * 2.5);

  // Camera slow push toward player
  cam.curZoom += (cam.txz - cam.curZoom) * Math.min(1, dt * 0.25);
  cam.curX += (cam.tax - cam.curX) * Math.min(1, dt * 0.2);
  cam.curY += (cam.tay - cam.curY) * Math.min(1, dt * 0.2);

  // Darkness fades in gradually (starts black, fades to reveal dungeon)
  if (t < 1.0) {
    CI.introDark = Math.max(0, 1.0 - t * 0.9);
  } else {
    CI.introDark = Math.max(0, CI.introDark - dt * 0.4);
  }

  // Typewriter for current line
  CI.typewriterTimer += dt;
  const charsPerSec = 32;
  const tl = CI.typewriterTarget.length;
  const sl = Math.min(tl, Math.floor(CI.typewriterTimer * charsPerSec));
  CI.typewriterText = CI.typewriterTarget.substring(0, sl);

  // Advance intro lines on timer
  if (!CI.done) {
    CI.lineLife -= dt;
    if (CI.lineLife <= 0) {
      CI.introLineIdx++;
      if (CI.introLineIdx >= CI.lines.length) {
        // All lines done — fade out and release control
        CI.done = true;
        CI.phase = 2;
      } else {
        const next = CI.lines[CI.introLineIdx];
        CI.typewriterTarget = next.text;
        CI.typewriterText = '';
        CI.typewriterTimer = 0;
        CI.lineLife = next.dur;
      }
    }
  }

  // Fade out letterbox when done
  if (CI.phase === 2) {
    CI.fade = Math.min(1, CI.fade + dt * 1.2);
    CI.letterbox = Math.max(0, CI.letterbox - dt * 2.0);
    if (CI.fade >= 1) {
      endIntroCinematic();
    }
  }

  tickPRT(dt);
}

function tickBossIntroCI(dt) {
  const cam = CI.cam;
  CI.bossIntroTimer += dt;
  const t = CI.bossIntroTimer;

  // Letterbox
  if (CI.letterbox < 1) CI.letterbox = Math.min(1, CI.letterbox + dt * 2.0);

  // Camera slow pan from player upward to boss
  cam.curZoom += (cam.txz - cam.curZoom) * Math.min(1, dt * 0.18);
  cam.curX += (cam.tax - cam.curX) * Math.min(1, dt * 0.12);
  cam.curY += (cam.tay - cam.curY) * Math.min(1, dt * 0.12);

  // Red vignette builds over time
  CI.vignetteAmt = Math.min(0.55, t * 0.06);

  // Boss eye ignition and wing spread animate in
  if (t > 1.0) CI.bossEyeGlow = Math.min(1, (t - 1.0) * 0.8);
  if (t > 2.0) CI.bossWingSpread = Math.min(1, (t - 2.0) * 0.5);

  // Start showing subtitles after 1.5s
  if (t > 1.5 && CI.bossIntroLineIdx < CI.lines.length && CI.typewriterTarget === '') {
    const next = CI.lines[CI.bossIntroLineIdx];
    CI.typewriterTarget = next.text;
    CI.typewriterText = '';
    CI.typewriterTimer = 0;
    CI.lineLife = next.dur;
  }

  // Typewriter
  CI.typewriterTimer += dt;
  const charsPerSec = 32;
  const tl = CI.typewriterTarget.length;
  const sl = Math.min(tl, Math.floor(CI.typewriterTimer * charsPerSec));
  CI.typewriterText = CI.typewriterTarget.substring(0, sl);

  // Advance subtitle lines
  if (!CI.done && CI.typewriterTarget !== '') {
    CI.lineLife -= dt;
    if (CI.lineLife <= 0) {
      CI.bossIntroLineIdx++;
      if (CI.bossIntroLineIdx >= CI.lines.length) {
        CI.done = true;
        CI.phase = 2;
      } else {
        const next = CI.lines[CI.bossIntroLineIdx];
        CI.typewriterTarget = next.text;
        CI.typewriterText = '';
        CI.typewriterTimer = 0;
        CI.lineLife = next.dur;
      }
    }
  }

  // Fade out and activate boss
  if (CI.phase === 2) {
    CI.fade = Math.min(1, CI.fade + dt * 1.0);
    CI.letterbox = Math.max(0, CI.letterbox - dt * 1.5);
    if (CI.fade >= 1) {
      endBossIntroCinematic();
    }
  }

  tickPRT(dt);
}

function drawIntroCI() {
  const cam = CI.cam;
  CX.save();
  const ox = LW / 2 - cam.curX * T * cam.curZoom;
  const oy = LH / 2 - cam.curY * T * cam.curZoom;
  CX.translate(ox, oy);
  CX.scale(cam.curZoom, cam.curZoom);

  // Draw normal world
  const th = getTheme();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!MAP[r] || MAP[r][c] === undefined) continue;
    const tile = MAP[r][c], px = c * T, py = r * T;
    if (tile === 1) { CX.fillStyle = th.wc[(r * 37 + c * 13) % 4]; CX.fillRect(px, py, T, T); }
    else if (tile === 0 || tile === 2) { CX.fillStyle = th.fc[(r * 7 + c * 19) % 4]; CX.fillRect(px, py, T, T); }
  }

  // Torches
  TORCHES.forEach(t => {
    const fl = Math.sin(F * .22 + t.ph) * .2 + 1;
    const px = (t.x + .5) * T, py = (t.y + .5) * T;
    CX.fillStyle = '#78350f'; CX.fillRect(px - 2, py - 1, 4, 7);
    CX.fillStyle = ['#fde68a', '#f97316', '#fb923c'][(Math.floor(F * .28 + t.ph * 3)) % 3];
    CX.beginPath(); CX.ellipse(px, py - 5, 3.5 * fl, 6 * fl, 0, 0, 6.28); CX.fill();
  });

  // Player kneeling (breathing idle pose)
  AnimSystem.drawPlayer();

  drawPRT();
  CX.restore();

  // Darkness overlay fades from black
  if (CI.introDark > 0) {
    CX.fillStyle = 'rgba(0,0,0,' + CI.introDark.toFixed(3) + ')';
    CX.fillRect(0, 0, LW, LH);
  }

  // Fade overlay
  if (CI.fade > 0) {
    CX.fillStyle = 'rgba(0,0,0,' + CI.fade.toFixed(3) + ')';
    CX.fillRect(0, 0, LW, LH);
  }

  // Letterbox bars
  const lbH = 52 * easeInOut(CI.letterbox);
  CX.fillStyle = '#000';
  CX.fillRect(0, 0, LW, lbH);
  CX.fillRect(0, LH - lbH, LW, lbH);

  // Subtitle
  if (CI.typewriterText && CI.letterbox > 0.3) {
    const subY = LH - lbH - 22;
    const maxW = LW * 0.7;
    CX.font = 'italic 18px "Crimson Text", serif';
    CX.textAlign = 'center'; CX.textBaseline = 'alphabetic';
    const words = CI.typewriterText.split(' ');
    let row = '', rows = [];
    words.forEach(w => { const t2 = row + (row ? ' ' : '') + w; if (CX.measureText(t2).width > maxW) { rows.push(row); row = w; } else row = t2; });
    rows.push(row);
    const rh = 22, totalH = rows.length * rh;
    const sy = subY - totalH + rh;
    const bgX = LW * 0.15;
    const bgW = LW * 0.7;
    const bgH = totalH + 18;
    const grad = CX.createLinearGradient(0, sy - 14, 0, sy + bgH);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.2, 'rgba(0,0,0,0.72)');
    grad.addColorStop(1, 'rgba(0,0,0,0.72)');
    CX.fillStyle = grad; CX.fillRect(bgX, sy - 14, bgW, bgH);
    // Thin separator
    CX.strokeStyle = 'rgba(201,168,76,0.5)'; CX.lineWidth = 1;
    CX.beginPath(); CX.moveTo(LW * 0.2, sy - 8); CX.lineTo(LW * 0.8, sy - 8); CX.stroke();
    CX.fillStyle = 'rgba(220,210,190,0.95)';
    rows.forEach((r, i) => CX.fillText(r, LW / 2, sy + i * rh));
    // Blinking cursor
    if (CI.typewriterText.length < CI.typewriterTarget.length || (Math.floor(F * 0.05) % 2 === 0)) {
      CX.fillStyle = 'rgba(220,210,190,0.8)';
      const lastRowW = CX.measureText(rows[rows.length - 1]).width;
      CX.fillRect(LW / 2 + lastRowW / 2 + 3, sy + (rows.length - 1) * rh - 14, 2, 16);
    }
  }
}

function drawBossIntroCI() {

      CX.strokeStyle = '#334155'; CX.lineWidth = 5;
      CX.beginPath(); CX.moveTo(bx + 26, by - 36); CX.lineTo(bx + 26, by + 26); CX.stroke();
      CX.fillStyle = '#64748b';
      CX.fillRect(bx + 14, by - 46, 24, 18);

      // Tattered Robe
      CX.beginPath();
      CX.moveTo(bx, by - 26 + floatY);
      CX.lineTo(bx - 20, by + 28 + floatY);
      CX.lineTo(bx + 20, by + 28 + floatY);
      CX.closePath(); CX.fill();
      // Glowing Void Core Orb
      const orbPulse = Math.sin(F * 0.15) * 0.2 + 0.8;
      const og = CX.createRadialGradient(bx, by - 6 + floatY, 2, bx, by - 6 + floatY, 24 * orbPulse);

      for (let side = -1; side <= 1; side += 2) {

    if (CI.typewriterText.length < CI.typewriterTarget.length || (Math.floor(F * 0.05) % 2 === 0)) {

      const lastRowW = CX.measureText(rows[rows.length - 1]).width;
      CX.fillRect(LW / 2 + lastRowW / 2 + 3, sy + (rows.length - 1) * rh - 14, 2, 16);
    }
  }
}

// ── Achievement Checker (reliable, runs every frame in playing state) ─
function checkAchievements() {
  if (!ACHIEVEMENTS) return;
  // first_blood
  if (!ACHIEVEMENTS.first_blood.unlocked && P.killed >= 1) unlockAchievement('first_blood');
  // savior
  if (!ACHIEVEMENTS.savior.unlocked && P.saved >= 5) unlockAchievement('savior');
  // untouchable — checked on exit, but also verify continuously
  // (actual unlock remains in checkExit to ensure level completion)
  // sanity_keeper
  if (!ACHIEVEMENTS.sanity_keeper.unlocked && LV >= 5 && P.san > 70) unlockAchievement('sanity_keeper');
  // boss_slayer
  if (!ACHIEVEMENTS.boss_slayer.unlocked && BOSS_DEAD) unlockAchievement('boss_slayer');
  // shield_bearer
  if (!ACHIEVEMENTS.shield_bearer.unlocked && P.shieldActive) unlockAchievement('shield_bearer');
  // sharpshooter
  if (!ACHIEVEMENTS.sharpshooter.unlocked && BOW_KILLS >= 10) unlockAchievement('sharpshooter');
}

// ── Main Loop ─────────────────────────────────────────────────────────
function loop(ts) {
  if(!lastTime) lastTime=ts;
  DT=Math.min((ts-lastTime)/1000,0.033);
  lastTime=ts; F++;

  const frozen=FREEZE_TIME>0;
  if(frozen) FREEZE_TIME=Math.max(0,FREEZE_TIME-DT);

  CX.clearRect(0,0,LW,LH);
  CX.save();

  if(SHK>0.3){CX.translate((Math.random()-.5)*SHK,(Math.random()-.5)*SHK);SHK*=Math.pow(.74,DT*TARGET_FPS);}else SHK=0;
  if(FADEIN){FADE=Math.max(0,FADE-DT*3);if(FADE<=0){FADE=0;FADEIN=false;}}
  if(AFL>0) AFL=Math.max(0,AFL-DT);
  if(DFL>0) DFL=Math.max(0,DFL-DT);

  if(STATE==='title'){
    drawTitle(); _hideIngamePause();
  } else if(STATE==='titlecinematic'){
    TC_tick(DT); TC_draw(); _hideIngamePause();
  } else if(STATE==='training'){
    TR_tick(DT); TR_draw(); _hideIngamePause();
  } else if(STATE==='playing'){
    _showIngamePause();
    const isWarping = (typeof WARP_ACTIVE !== 'undefined' && WARP_ACTIVE);
    const isPausedByEvent = (typeof ACTIVE_EVENT_CHOICE !== 'undefined' && ACTIVE_EVENT_CHOICE !== null) || (typeof ACTIVE_MEMORY_ECHO !== 'undefined' && ACTIVE_MEMORY_ECHO !== null) || isWarping;
    const inHitStop = (typeof HIT_STOP_TIMER !== 'undefined' && HIT_STOP_TIMER > 0);
    const GDT = (frozen || isPausedByEvent || inHitStop) ? 0 : DT * GAME_SPEED;
    if(!frozen && !isPausedByEvent){tickPlayer(GDT);tickENE(GDT);tickTraps(GDT);tickSanity(GDT);if (isBossFloor() && BOSS && BOSS.alive) tickBoss(GDT);}
    // Tick GAME_MSG_TIMER using real DT (not game speed) so messages display consistently
    if(GAME_MSG_TIMER>0){GAME_MSG_TIMER-=DT;if(GAME_MSG_TIMER<=0){GAME_MSG='';GAME_MSG_TIMER=0;}}
    tickPRT(GDT); tickSlashTrails(GDT); tickProjectiles(GDT); tickAchievToasts(DT);
    checkAchievements();
    SoundManager.updateMusicLayers(DT);
    FX.update(DT);
    if (typeof tickImpactShockwaves === 'function') tickImpactShockwaves(DT);
    if (typeof tickCosmicHyperWarp === 'function') tickCosmicHyperWarp(DT);
    drawWorld(); drawAchievToasts(); drawHUD();
    if(AFL>0){CX.fillStyle=`rgba(255,255,255,${AFL/0.22})`;CX.fillRect(0,0,LW,LH);}
    if(DFL>0){CX.fillStyle=`rgba(220,38,38,${DFL/0.33})`;CX.fillRect(0,0,LW,LH);}
    if(P.san<40){const s=(40-P.san)/40;const vg=CX.createRadialGradient(LW/2,LH/2,LW*.13,LW/2,LH/2,LW*.72);vg.addColorStop(0,'transparent');vg.addColorStop(1,`rgba(80,0,120,${s*.62})`);CX.fillStyle=vg;CX.fillRect(0,0,LW,LH);}
    if(FADE>0){CX.fillStyle=`rgba(0,0,0,${FADE})`;CX.fillRect(0,0,LW,LH);}
  } else if(STATE==='cinematic' || STATE==='boss_intro'){
    _showIngamePause();
    tickCI(DT); drawCI(); drawHUD();
  } else if(STATE==='death_normal' || STATE==='death_sanity'){
    drawDeathScreen(); _hideIngamePause();
  } else if(STATE==='endcard'){
    drawEnd(); _hideIngamePause();
  } else if(STATE==='pause'){
    _showIngamePause();
    drawWorld(); drawHUD(); drawPause();
  } else if(STATE==='settings'){
    drawTitle(); drawSettings(); _hideIngamePause();
  } else if(STATE==='achievements'){
    drawTitle(); drawAchievPanel(); _hideIngamePause();
  } else if(STATE==='sanctum'){
    drawTitle(); if (typeof drawSanctumPanel === 'function') drawSanctumPanel(); _hideIngamePause();
  } else if(STATE==='codex'){
    drawTitle(); if (typeof drawCodexPanel === 'function') drawCodexPanel(); _hideIngamePause();
  }

  CX.restore();
  requestAnimationFrame(loop);
}

// ─────────────────────────────────────────────────────────────────────
// 1. CINEMATIC TITLE CARD — TC_* namespace
// ─────────────────────────────────────────────────────────────────────
const TC = {
  timer: 0,
  phase: 0,      // 0=darkness, 1=torch ignite, 2=title reveal, 3=subtitle, 4=done
  fade: 1.0,
  titleAlpha: 0,
  subtitleAlpha: 0,
  dustParticles: [],
  torchSparks: [],
  skipped: false,
};

function TC_reset() {
  TC.timer = 0; TC.phase = 0; TC.fade = 1.0;
  TC.titleAlpha = 0; TC.subtitleAlpha = 0;
  TC.dustParticles = []; TC.torchSparks = [];
  TC.skipped = false;
  _TITLE_ANIM_T = 0;
  // seed dust particles
  for (let i = 0; i < 28; i++) {
    TC.dustParticles.push({
      x: Math.random() * LW, y: Math.random() * LH,
      vx: (Math.random()-0.5)*0.22, vy: (Math.random()-0.5)*0.15,
      alpha: Math.random()*0.18+0.04, r: Math.random()*1.8+0.6
    });
  }
}
TC_reset();

function TC_skip() {
  TC.skipped = true;
  TC.phase = 99;
  _TITLE_ANIM_T = 0;
  STATE = 'title';
}

function TC_tick(dt) {
  if (TC.skipped || TC.phase >= 99) { STATE = 'title'; return; }
  TC.timer += dt;

  // Update dust
  TC.dustParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = LW; if (p.x > LW) p.x = 0;
    if (p.y < 0) p.y = LH; if (p.y > LH) p.y = 0;
  });

  // Phase 0 → 1: pure darkness with dust, ~1.2s
  if (TC.phase === 0 && TC.timer > 1.2) { TC.phase = 1; TC.timer = 0; }

  // Phase 1 → torch sparks + light reveal, ~1.8s
  if (TC.phase === 1) {
    if (F % 3 === 0) {
      for (let i = 0; i < 3; i++) {
        TC.torchSparks.push({
          x: LW/2 + (Math.random()-0.5)*180, y: LH*0.62 + (Math.random()-0.5)*40,
          vx: (Math.random()-0.5)*1.8, vy: -Math.random()*2.2-0.5,
          life: 1.0, col: Math.random()<0.5?'#fde68a':'#f97316', r: Math.random()*2.5+1
        });
      }
    }
    TC.fade = Math.max(0, 1 - TC.timer/1.8);
    if (TC.timer > 1.8) { TC.phase = 2; TC.timer = 0; }
  }
  if (TC.phase >= 1) {
    TC.torchSparks.forEach(s => { s.x+=s.vx; s.y+=s.vy; s.vy+=0.04; s.life-=dt*1.1; });
    TC.torchSparks = TC.torchSparks.filter(s => s.life > 0);
  }

  // Phase 2 → title golden reveal, ~1.5s
  if (TC.phase === 2) {
    TC.titleAlpha = Math.min(1, TC.timer / 1.5);
    if (TC.timer > 1.5) { TC.phase = 3; TC.timer = 0; }
  }

  // Phase 3 → subtitle + hold, ~1.8s then go to title
  if (TC.phase === 3) {
    TC.titleAlpha = 1;
    TC.subtitleAlpha = Math.min(1, TC.timer / 1.0);
    if (TC.timer > 2.2) { TC.phase = 4; TC.timer = 0; }
  }

  // Phase 4 → fade out and transition
  if (TC.phase === 4) {
    TC.fade = Math.min(1, TC.timer / 0.7);
    if (TC.timer > 0.7) {
      _TITLE_ANIM_T = 0;
      STATE = 'title';
    }
  }
}

function TC_draw() {
  // Background dungeon silhouette
  CX.fillStyle = '#000'; CX.fillRect(0, 0, LW, LH);

  // Dungeon floor silhouette (background atmosphere)
  CX.fillStyle = '#0a0a18';
  for (let i = 0; i < Math.ceil(LW/40)+1; i++) {
    const bx = i*40, bh = i%2===0?60:40;
    CX.fillRect(bx, LH-bh, 36, bh);
  }
  CX.fillRect(0, LH-30, LW, 30);

  // Dust particles
  TC.dustParticles.forEach(p => {
    CX.save(); CX.globalAlpha = p.alpha * (TC.phase >= 1 ? 0.7 : 1);
    CX.fillStyle = '#c9a84c'; CX.beginPath(); CX.arc(p.x, p.y, p.r, 0, 6.28); CX.fill();
    CX.restore();
  });

  // Torch sparks (phase 1+)
  if (TC.phase >= 1) {
    TC.torchSparks.forEach(s => {
      CX.save(); CX.globalAlpha = s.life * 0.85;
      CX.fillStyle = s.col; CX.shadowColor = s.col; CX.shadowBlur = 8;
      CX.beginPath(); CX.arc(s.x, s.y, s.r*s.life, 0, 6.28); CX.fill();
      CX.restore();
    });
    // Torch glow radial under title area
    const torchAmt = TC.phase===1 ? Math.min(1, TC.timer/1.8) : 1;
    const tg = CX.createRadialGradient(LW/2, LH*0.72, 0, LW/2, LH*0.72, 280);
    tg.addColorStop(0, `rgba(249,115,22,${torchAmt*0.22})`);
    tg.addColorStop(0.5, `rgba(201,168,76,${torchAmt*0.10})`);
    tg.addColorStop(1, 'rgba(0,0,0,0)');
    CX.fillStyle = tg; CX.fillRect(0, 0, LW, LH);
  }

  // Title reveal (phase 2+)
  if (TC.titleAlpha > 0) {
    const ta = TC.titleAlpha;
    // Glow pulse
    const gp = Math.sin(F * 0.06) * 0.18 + 0.82;
    CX.save(); CX.globalAlpha = ta;
    CX.shadowColor = '#c9a84c'; CX.shadowBlur = 50 * gp;
    CX.fillStyle = '#fde68a'; CX.font = 'bold 72px Cinzel,serif';
    CX.textAlign = 'center'; CX.textBaseline = 'alphabetic';
    CX.fillText('DUNGEON', LW/2, LH/2 - 40);
    CX.fillText('BREAK', LW/2, LH/2 + 42);
    CX.shadowBlur = 0;
    CX.fillStyle = 'rgba(201,168,76,0.55)'; CX.font = 'italic 16px Crimson Text,serif';
    CX.fillText('— ABYSS EDITION —', LW/2, LH/2 + 72);
    CX.restore();
  }

  // Subtitle (phase 3+)
  if (TC.subtitleAlpha > 0) {
    CX.save(); CX.globalAlpha = TC.subtitleAlpha * 0.82;
    CX.fillStyle = '#94a3b8'; CX.font = 'italic 15px Crimson Text,serif';
    CX.textAlign = 'center'; CX.textBaseline = 'alphabetic';
    CX.fillText('"Escape the dungeon before it consumes you."', LW/2, LH/2 + 108);
    CX.restore();
  }

  // Skip hint
  if (TC.phase <= 3) {
    const sh = (Math.sin(F*0.07)*0.3+0.5);
    CX.save(); CX.globalAlpha = sh * 0.55;
    CX.fillStyle = '#64748b'; CX.font = '10px Cinzel,serif';
    CX.textAlign = 'center'; CX.textBaseline = 'alphabetic';
    CX.fillText('[ Click or Enter to skip ]', LW/2, LH - 18);
    CX.restore();
  }

  // Fade overlay (darkness in/out)
  if (TC.fade > 0) {
    CX.fillStyle = `rgba(0,0,0,${TC.fade})`; CX.fillRect(0, 0, LW, LH);
  }
}

function TR_handleClick(mx, my) {

function TR_handleExit() { if (TR.room === 7) TR_exitToMenu(); }

function TR_exitToMenu() {

  TR.fade = 0;
}

function TR_nextRoom() {
  if (TR.room >= 7) return;
  TR.room++;
  TR.msgAlpha = 0; TR.msgTimer = 0;
  TR.currentMsg = TR_ROOMS[TR.room].msg;
  TR.fade = 1.0; TR.fadingIn = true;
  TR._roomDwell = 0;

  // Clear arrays populated by previous rooms
  ENE = []; TRAPS = []; ITEMS = []; ALLIES = [];

  if (TR.room === 2) {
    // Trap Room — place a real spike trap at centre
    TRAPS = [{ x: 14, y: 10, type: 'spike', timer: 0 }];
  }
  if (TR.room === 3) {
    // Weapon Room — place a real weapon item
    ITEMS = [{ x: 14, y: 10, taken: false, kind: 'weapon', sub: 'sword', rarity: RARITIES[0] }];
    TR.weaponPickedUp = false;
  }
  if (TR.room === 4) {
    // Enemy Room — place a slow skeleton (only once weapon is picked up, enforced in tick)
    TR.trainingEne = {
      x: 18, y: 10, vx: 0, vy: 0, alive: true,
      hp: 1, maxHp: 1, type: 'skeleton',
      alertT: 1.33, atkC: 0, ph: 0, dAnim: 0,
      hitFlash: 0, animState: 'idle', animTimer: 0, walkCycle: 0
    };
    ENE = [TR.trainingEne];
  }
  if (TR.room === 6) {
    // Survivor Room — place a real ally NPC
    ALLIES = [{ x: 18, y: 10, rescued: false, ph: 0.3 }];
  }
}

function TR_tick(dt) {
  TR.timer += dt;
  TR.pulseTrap = (Math.sin(TR.timer * 4) * 0.5 + 0.5);
  TR.weaponBob = Math.sin(TR.timer * 2.2) * 3;
  TR.npcBob = Math.sin(TR.timer * 1.4) * 2;
  TR.exitPortalGlow = Math.sin(TR.timer * 2.8) * 0.4 + 0.6;

  // Fade in
  if (TR.fadingIn) { TR.fade = Math.max(0, TR.fade - dt * 3); if (TR.fade <= 0) TR.fadingIn = false; }

  // Fade out → go to menu
  if (TR.fadingOut) {
    TR.fade = Math.min(1, TR.fade + dt * 3);
    if (TR.fade >= 1) { TR.fadingOut = false; _TITLE_ANIM_T = 0; STATE = 'title'; return; }
  }

  // Message alpha
  TR.msgTimer += dt;
  TR.msgAlpha = Math.min(1, TR.msgTimer * 2.0);

  // Player movement
  let dx = 0, dy = 0;
  if (K['ArrowUp']    || K['w']) dy = -1;
  if (K['ArrowDown']  || K['s']) dy =  1;
  if (K['ArrowLeft']  || K['a']) dx = -1;
  if (K['ArrowRight'] || K['d']) dx =  1;
  if (Math.abs(TOUCH_DIR.x) > 0.15 || Math.abs(TOUCH_DIR.y) > 0.15) {
    const L = Math.hypot(TOUCH_DIR.x, TOUCH_DIR.y)||1;
    dx = TOUCH_DIR.x/L; dy = TOUCH_DIR.y/L;
  }
  const moving = (dx !== 0 || dy !== 0);
  if (moving) {
    const L = Math.hypot(dx,dy)||1;
    dx = dx/L*4*dt; dy = dy/L*4*dt;
    if (Math.abs(dx) > Math.abs(dy)) { TR.playerFx = dx>0?1:-1; TR.playerFy = 0; }
    else { TR.playerFx = 0; TR.playerFy = dy>0?1:-1; }
    TR.playerX += dx; TR.playerY += dy;
    TR.playerX = Math.max(1.3, Math.min(COLS-2.3, TR.playerX));
    TR.playerY = Math.max(1.3, Math.min(ROWS-2.3, TR.playerY));
  }

  // Sync P so AnimSystem.drawPlayer works correctly
  P.x = TR.playerX; P.y = TR.playerY;
  P.fx = TR.playerFx; P.fy = TR.playerFy;
  P.vx = dt > 0 ? (dx/dt) : 0; P.vy = dt > 0 ? (dy/dt) : 0;
  P.animState = moving ? 'walk' : 'idle';
  P.walkCycle += moving ? dt * 8 : 0;
  P.breathCycle += dt * 1.2;
  P.hitFlash = 0; P.dead = false; P.aanim = 0;

  // Tick particles (need F to advance)
  tickPRT(dt);

  // Tick room transition delay
  if (TR._nextRoomDelay > 0) {
    TR._nextRoomDelay -= dt;
    if (TR._nextRoomDelay <= 0) { TR._nextRoomDelay = 0; TR_nextRoom(); }
  }

  // Room-specific logic
  if (TR.room === 1 && moving) {
    TR._movedTimer = (TR._movedTimer||0) + dt;
    if (TR._movedTimer > 2.5) { TR._movedTimer = 0; TR_nextRoom(); }
  }

  // Weapon Room — detect real item pickup
  if (TR.room === 3 && !TR.weaponPickedUp) {
    ITEMS.forEach(it => {
      if (!it.taken && Math.hypot(TR.playerX - it.x, TR.playerY - it.y) < 1.1) {
        it.taken = true;
        TR.weaponPickedUp = true;
        P.wep = it.sub; P.wepRarity = it.rarity;
        SoundManager.snd('item_pickup');
        spawnP(it.x, it.y, 8, {col:'#fde68a', spd:1.0, life:0.6, r:3, star:true});
        TR._nextRoomDelay = 0.6;
      }
    });
  }

  // Enemy Room — AI (only if weapon is held)
  if (TR.room === 4 && TR.trainingEne && TR.trainingEne.alive) {
    const e = TR.trainingEne;
    const edx = TR.playerX - e.x, edy = TR.playerY - e.y;
    const ed = Math.hypot(edx, edy) || 1;
    // Slower than normal enemies
    e.vx += (edx/ed) * 1.2 * 0.18 * dt;
    e.vy += (edy/ed) * 1.2 * 0.18 * dt;
    const spd2 = Math.hypot(e.vx, e.vy);
    if (spd2 > 1.2*dt) { e.vx = e.vx/spd2*1.2*dt; e.vy = e.vy/spd2*1.2*dt; }
    e.vx *= Math.pow(0.82, dt*TARGET_FPS); e.vy *= Math.pow(0.82, dt*TARGET_FPS);
    e.x += e.vx; e.y += e.vy;
    e.x = Math.max(1.3, Math.min(COLS-2.3, e.x));
    e.y = Math.max(1.3, Math.min(ROWS-2.3, e.y));
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.ph += 0.04*dt*TARGET_FPS;
    AnimSystem.tickEnemy(e, dt);

    // Player attack
    if (K[' '] && P.wep && ed < 1.8) {
      TR._atkCd = TR._atkCd || 0;
      if (TR._atkCd <= 0) {
        TR._atkCd = 0.35;
        e.hp--; e.hitFlash = 0.25;
        SoundManager.snd('melee_hit');
        spawnP(e.x, e.y, 6, {col:'#ef4444',spd:1.2,life:0.3,r:3});
        if (e.hp <= 0) {
          e.alive = false; e.dAnim = 0.5;
          SoundManager.snd('enemy_death');
          spawnP(e.x, e.y, 12, {col:'#ef4444',spd:1.5,life:0.8,r:4});
          TR._nextRoomDelay = 0.9;
        }
      }
    }
    if (TR._atkCd > 0) TR._atkCd -= dt;
  }

  // Exit portal proximity check
  if (TR.room === 7) {
    const portalTX = COLS/2, portalTY = (ROWS/2)+2;
    if (Math.hypot(TR.playerX - portalTX, TR.playerY - portalTY) < 1.5) {
      TR_exitToMenu();
    }
  }

  // Auto-advance for non-interactive rooms [spawn, mvmt, trap, wpn, ene, sanity, surv, portal]
  const autoDwell = [7, 0, 8, 0, 0, 8, 8, 0];
  if (autoDwell[TR.room] > 0) {
    TR._roomDwell = (TR._roomDwell||0) + dt;
    if (TR._roomDwell > autoDwell[TR.room]) { TR._roomDwell = 0; TR_nextRoom(); }
  }
}

function TR_draw() {

  CX.fillStyle = '#000'; CX.fillRect(0, 0, LW, LH);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!MAP[r]) continue;
      const tile = MAP[r][c];
      const px = c*T, py = r*T;
      if (tile === 1) {
        CX.fillStyle = th.wc[(r*37+c*13)%4]; CX.fillRect(px,py,T,T);
      } else {
        CX.fillStyle = th.fc[(r*7+c*19)%4]; CX.fillRect(px,py,T,T);

  // ── Real TRAPS rendering (identical to main game) ──────────────────
  TRAPS.forEach(t => {

// ─────────────────────────────────────────────────────────────────────
// 3. PORTAL WARP TRANSITION  — called from checkExit portal logic
// ─────────────────────────────────────────────────────────────────────
const PW = {
  active: false, timer: 0, phase: 0,
  onComplete: null,
};

function startPortalWarp(callback) {
  PW.active = true; PW.timer = 0; PW.phase = 0;
  PW.onComplete = callback || null;
}

function tickPortalWarp(dt) {
  if (!PW.active) return;
  PW.timer += dt;
  if (PW.phase === 0 && PW.timer > 0.3) { PW.phase = 1; PW.timer = 0; }
  if (PW.phase === 1 && PW.timer > 0.4) { PW.phase = 2; PW.timer = 0; }
  if (PW.phase === 2 && PW.timer > 0.22) {
    PW.phase = 3; PW.timer = 0;
    if (PW.onComplete) PW.onComplete();
  }
  if (PW.phase === 3 && PW.timer > 0.5) { PW.active = false; }
  // Spawn spiral particles during phases 0-1
  if (PW.phase <= 1 && F % 2 === 0) {
    const a = PW.timer * 18; const r = 1.5;
    spawnP(P.x + Math.cos(a)*r, P.y + Math.sin(a)*r, 2, {col:'#34d399',spd:1.2,life:0.4,r:3,star:true});
  }
}

function drawPortalWarp() {
  if (!PW.active) return;
  if (PW.phase === 1) {
    const z = Math.min(1, PW.timer / 0.4);
    CX.save();
    const wg = CX.createRadialGradient(LW/2,LH/2,0,LW/2,LH/2,LW*0.7);
    wg.addColorStop(0,'rgba(52,211,153,0)');
    wg.addColorStop(0.5,`rgba(52,211,153,${z*0.15})`);
    wg.addColorStop(1,'rgba(0,0,0,0)');
    CX.fillStyle=wg; CX.fillRect(0,0,LW,LH); CX.restore();
  }
  if (PW.phase === 2) {
    const fl = Math.min(1, PW.timer/0.22);
    CX.fillStyle=`rgba(255,255,255,${fl})`; CX.fillRect(0,0,LW,LH);
  }
}

function drawDynamicTorchLighting() {
  if (typeof TORCHES === 'undefined' || STATE !== 'playing') return;
  TORCHES.forEach(t => {
    const fl = Math.sin(F * 0.22 + t.ph) * 0.15 + 1;
    const tx2 = (t.x + 0.5) * T, ty2 = (t.y + 0.5) * T;
    const radius = T * (3.2 + fl * 0.6);
    const tg = CX.createRadialGradient(tx2, ty2, 0, tx2, ty2, radius);
    const warm = `rgba(249,115,22,${0.13 * fl})`;
    tg.addColorStop(0, warm);
    tg.addColorStop(0.5, `rgba(251,146,60,${0.06*fl})`);
    tg.addColorStop(1, 'rgba(0,0,0,0)');
    CX.fillStyle = tg; CX.fillRect(tx2-radius, ty2-radius, radius*2, radius*2);
  });
}

// 5. FOG SYSTEM
// ─────────────────────────────────────────────────────────────────────
const FOG = {
  particles: [],
  timer: 0,
};
for (let i = 0; i < 18; i++) {
  FOG.particles.push({
    x: Math.random()*LW, y: Math.random()*LH,
    vx: (Math.random()-0.5)*0.18, vy: (Math.random()-0.5)*0.06,
    alpha: Math.random()*0.05+0.015, r: Math.random()*55+30,
    ph: Math.random()*6.28
  });
}

function tickFog(dt) {
  FOG.timer += dt;
  FOG.particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.ph += dt * 0.4;
    if (p.x < -p.r) p.x = LW + p.r;
    if (p.x > LW + p.r) p.x = -p.r;
    if (p.y < -p.r) p.y = LH + p.r;
    if (p.y > LH + p.r) p.y = -p.r;
  });
}

function drawFog() {
  if (STATE !== 'playing') return;
  FOG.particles.forEach(p => {
    const pa = p.alpha * (0.7 + Math.sin(p.ph) * 0.3);
    CX.save(); CX.globalAlpha = pa;
    CX.fillStyle = '#c4c4d0';
    CX.beginPath(); CX.arc(p.x, p.y, p.r, 0, 6.28); CX.fill();
    CX.restore();
  });
  // Screen edge darkening for atmosphere
  const eg = CX.createRadialGradient(LW/2, LH/2, LW*0.32, LW/2, LH/2, LW*0.72);
  eg.addColorStop(0, 'rgba(0,0,0,0)');
  eg.addColorStop(1, 'rgba(0,0,0,0.28)');
  CX.fillStyle = eg; CX.fillRect(0, 0, LW, LH);
}

// ─────────────────────────────────────────────────────────────────────
// 6. HALLUCINATION SYSTEM
// ─────────────────────────────────────────────────────────────────────
const HAL = {
  shadowEnemies: [],     // shadow shapes that vanish on approach
  fakeTraps: [],         // fake traps that vanish on step
  whisperTimer: 0,
  whisperInterval: 4.5,
  distortWave: 0,
  purpleTintAlpha: 0,
};

function tickHallucinations(dt) {
  if (typeof P === 'undefined' || STATE !== 'playing') return;
  const san = P.san;

  // Severity levels
  const mild   = san < 60 && san >= 40;
  const medium = san < 40 && san >= 20;
  const severe = san < 20 && san >= 8;
  const extreme= san < 8;

  // Mild — whispers (audio) + shadow shapes in corners
  if (mild || medium || severe || extreme) {
    HAL.whisperTimer += dt;
    if (HAL.whisperTimer >= HAL.whisperInterval) {
      HAL.whisperTimer = 0;
      HAL.whisperInterval = 3.0 + Math.random() * 3;
      // Whisper tone
      SoundManager.playTone(80 + Math.random()*40, 'sine', 0.8, 0.018, 60);
      // Shadow shape in random corner
      if (HAL.shadowEnemies.length < 4) {
        const corners = [{x:2,y:2},{x:COLS-3,y:2},{x:2,y:ROWS-3},{x:COLS-3,y:ROWS-3}];
        const c = corners[(Math.random()*4)|0];
        HAL.shadowEnemies.push({ x:c.x, y:c.y, alpha:0.7, life:2.5, fadingOut:false });
      }
    }
  }

  // Tick shadow enemies
  HAL.shadowEnemies.forEach(s => {
    s.life -= dt;
    if (s.life < 0.6 || Math.hypot(P.x-s.x, P.y-s.y) < 1.5) s.fadingOut = true;
    if (s.fadingOut) s.alpha = Math.max(0, s.alpha - dt*3);
  });
  HAL.shadowEnemies = HAL.shadowEnemies.filter(s => s.alpha > 0);

  // Medium — spawn fake traps occasionally
  if ((medium || severe || extreme) && Math.random() < dt * 0.12 && HAL.fakeTraps.length < 5) {
    const fx = 2 + Math.floor(Math.random()*(COLS-4));
    const fy = 2 + Math.floor(Math.random()*(ROWS-4));
    HAL.fakeTraps.push({ x:fx, y:fy, life:3.5, alpha:0.7 });
  }
  HAL.fakeTraps.forEach(ft => {
    ft.life -= dt;
    if (ft.life < 0.5 || Math.hypot(P.x-ft.x, P.y-ft.y) < 0.6) ft.alpha = Math.max(0, ft.alpha-dt*4);
    else ft.alpha = Math.min(0.7, ft.alpha);
  });
  HAL.fakeTraps = HAL.fakeTraps.filter(ft => ft.alpha > 0);

  // Severe / Extreme — distortion wave and purple tint
  if (severe || extreme) {
    HAL.distortWave = (HAL.distortWave + dt * (severe ? 1.8 : 3.5)) % (Math.PI * 2);
  }
  const targetPurple = extreme ? 0.28 : severe ? 0.18 : medium ? 0.08 : mild ? 0.03 : 0;
  HAL.purpleTintAlpha += (targetPurple - HAL.purpleTintAlpha) * Math.min(1, dt * 1.5);
}

function drawHallucinations() {
  if (STATE !== 'playing') return;
  const san = P.san;

  // Shadow enemies
  HAL.shadowEnemies.forEach(s => {
    const sx=(s.x+0.5)*T, sy=(s.y+0.5)*T;
    CX.save(); CX.globalAlpha=s.alpha*0.62;
    CX.fillStyle='#1a0030'; CX.shadowColor='#7c3aed'; CX.shadowBlur=12;
    CX.beginPath(); CX.ellipse(sx,sy,9,13,0,0,6.28); CX.fill();
    CX.beginPath(); CX.arc(sx,sy-16,7,0,6.28); CX.fill();
    CX.restore();
  });

  // Fake traps
  HAL.fakeTraps.forEach(ft => {
    const ftx=(ft.x+0.5)*T, fty=(ft.y+0.5)*T;
    CX.save(); CX.globalAlpha=ft.alpha;
    CX.strokeStyle='rgba(239,68,68,0.7)'; CX.lineWidth=2;
    CX.shadowColor='#ef4444'; CX.shadowBlur=8;
    CX.beginPath(); CX.arc(ftx,fty,T*0.45,0,6.28); CX.stroke();
    CX.fillStyle='rgba(239,68,68,0.12)'; CX.beginPath(); CX.arc(ftx,fty,T*0.45,0,6.28); CX.fill();
    CX.restore();
  });

  // Purple fog overlay
  if (HAL.purpleTintAlpha > 0.005) {
    CX.fillStyle=`rgba(60,0,120,${HAL.purpleTintAlpha})`;
    CX.fillRect(0,0,LW,LH);
  }

  // Distortion lines (severe+)
  if (san < 20) {
    const dw = HAL.distortWave;
    CX.save(); CX.globalAlpha=0.04 + (san < 8 ? 0.05 : 0);
    CX.strokeStyle='#a855f7'; CX.lineWidth=1.5;
    for (let y=0; y<LH; y+=18) {
      CX.beginPath();

let EVENT_ROOMS = [];       // array of { roomIdx, type, state, timer, npc }
let ESCORT_COUNT = 0;       // persistent across runs

const EVENT_TYPES = ['blood_ritual', 'cursed_shrine', 'lost_survivor'];

function buildEventRooms() {
  EVENT_ROOMS = [];
  if (LV === 10 || ROOMS.length < 3) return;
  // Skip room 0 (spawn) and last (portal)
  for (let i = 1; i < ROOMS.length - 1; i++) {
    if (Math.random() < 0.13) {
      const type = EVENT_TYPES[(Math.random() * EVENT_TYPES.length) | 0];
      EVENT_ROOMS.push({
        roomIdx: i,
        type,
        state: 'idle',     // idle | active | done
        timer: 0,
        npc: null,
        choicePromptTimer: 0,
      });
    }
  }
}

function getEventRoomAt(wx, wy) {
  for (const ev of EVENT_ROOMS) {
    if (ev.state === 'done') continue;
    const rm = ROOMS[ev.roomIdx];
    if (!rm) continue;
    if (wx >= rm.x && wx < rm.x + rm.w && wy >= rm.y && wy < rm.y + rm.h) return ev;
  }
  return null;
}

function tickEventRooms(dt) {
  if (STATE !== 'playing' || P.dead) return;
  EVENT_ROOMS.forEach(ev => {
    if (ev.state === 'done') return;
    const rm = ROOMS[ev.roomIdx];
    if (!rm) return;
    const inRoom = P.x >= rm.x && P.x < rm.x + rm.w && P.y >= rm.y && P.y < rm.y + rm.h;
    if (!inRoom) { ev.choicePromptTimer = 0; return; }

    ev.timer += dt;
    if (ev.state === 'idle') ev.state = 'active';

    ev.choicePromptTimer = Math.min(ev.choicePromptTimer + dt * 2, 1);

    // Blood particles in blood ritual room
    if (ev.type === 'blood_ritual' && F % 6 === 0) {
      spawnP(rm.cx, rm.cy, 1, { col: '#dc2626', spd: 0.3, life: 0.8, r: 2, gv: -0.02 });
    }
    if (ev.type === 'cursed_shrine' && F % 8 === 0) {
      spawnP(rm.cx, rm.cy, 1, { col: '#a855f7', spd: 0.25, life: 0.9, r: 1.8, gv: -0.03 });
    }
  });
}

    });

  } else if (P.wep === 'bow') {

    ENE.forEach(e => { if (!e.alive) return; const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < nearDist && d < 5) { nearDist = d; nearest = e; } });
    if (nearest) {
      const dx2 = nearest.x - P.x, dy2 = nearest.y - P.y;

// Full boss tick override with summoning & arena effects
const _tickBoss_orig = tickBoss;
tickBoss = function(dt) {
  _tickBoss_orig(dt);
  if (!BOSS) return;

  // ── Tick phase-3 timed traps ─────────────────────────────────────
  if (BOSS.phase3Triggered) {
    for (let i = TRAPS.length - 1; i >= 0; i--) {
      const t = TRAPS[i];
      if (!t.phase3) continue;
      t.life -= dt;
      if (t.life <= 0) TRAPS.splice(i, 1);
    }
  }

  if (!BOSS.alive) {
    // On kill, unlock achievements
    unlockAchievement('abyss_slayer');
    if (P.san >= 15) unlockAchievement('unbreakable');
    // Bug #5 fix: use elapsed time since boss fight started, not absolute timer
    const bossElapsed = BOSS.bossTimerStart !== undefined ? (LEVEL_TIMER - BOSS.bossTimerStart) : 999;
    if (bossElapsed < 60) unlockAchievement('speed_killer');
    return;
  }

  const hpPct = BOSS.hp / BOSS.maxHp;

  // ── Phase 2 announcement (60%) ───────────────────────────────────
  if (hpPct <= 0.60 && !BOSS.phaseAnnounced2) {
    BOSS.phaseAnnounced2 = true;
    GAME_MSG = '⚠️ "THE ABYSS CLAIMS YOU!"'; GAME_MSG_TIMER = 4;
    shk(16); SoundManager.snd('boss_roar');
    spawnP(BOSS.x, BOSS.y, 28, { col: '#7c3aed', spd: 2.0, life: 1.2, r: 5, star: true });
    BOSS.summonTimer = 0; // reset summon clock for phase 2 interval
  }

  // ── Phase 3 one-time arena transformation (25%) ──────────────────
  if (hpPct <= 0.25 && !BOSS.phase3Triggered) {
    BOSS.phase3Triggered = true;
    triggerPhase3ArenaTransform();
    BOSS.summonTimer = 0;
  }

  // ── Enemy summoning per phase ────────────────────────────────────
  BOSS.summonTimer += dt;
  const aliveCount = ENE.filter(e => e.alive).length;
  let summonInterval, summonCount;
  if (hpPct <= 0.25) {
    summonInterval = 4; summonCount = 6;
  } else if (hpPct <= 0.60) {
    summonInterval = 6; summonCount = 4;
  } else {
    summonInterval = 8; summonCount = 2;
  }

  if (BOSS.summonTimer >= summonInterval) {
    BOSS.summonTimer = 0;
    if (aliveCount < MAX_BOSS_ENEMIES) {
      if (hpPct <= 0.60) {
        // Spawn in circle around player
        for (let i = 0; i < summonCount; i++) {
          const offset = (i / summonCount) * 6.28;
          spawnBossMinion(BOSS.x, BOSS.y, offset);
        }
      } else {
        // Phase 1: scatter near boss
        for (let i = 0; i < summonCount; i++) spawnBossMinion(BOSS.x, BOSS.y);
      }
      shk(5);
    }
  }

  // ── Phase 3 ongoing effects ──────────────────────────────────────
  if (BOSS.phase3Triggered) {
    // Abyss energy wave every 5 seconds
    ABYSS_WAVE_TIMER += dt;
    if (ABYSS_WAVE_TIMER >= 5) {
      ABYSS_WAVE_TIMER = 0;
      shk(4);
      // Ring of purple particles expanding from boss
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * 6.28;
        spawnP(BOSS.x + Math.cos(a) * 0.5, BOSS.y + Math.sin(a) * 0.5, 2, { col: '#7c3aed', spd: 2.2, life: 0.9, r: 3, angle: a, spread: 0.3, star: true });
      }
      // Spawn 2-3 fresh phase3 fire traps avoiding player
      const newTraps = 2 + (Math.random() < 0.4 ? 1 : 0);
      for (let i = 0; i < newTraps; i++) {
        let pos;
        for (let a = 0; a < 15; a++) {
          pos = rndFloor(3);
          if (Math.hypot(pos.x - P.x, pos.y - P.y) > 1.8) break;
        }
        TRAPS.push({ x: pos.x, y: pos.y, type: 'fire', timer: Math.random() * 2, phase3: true, life: 8 });
      }
    }

    // Abyss fog movement
    ABYSS_FOG.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.ph += dt * 0.5;
      if (p.x < -p.r) p.x = LW + p.r;
      if (p.x > LW + p.r) p.x = -p.r;
      if (p.y < -p.r) p.y = LH + p.r;
      if (p.y > LH + p.r) p.y = -p.r;
    });

    // Floor crack particles occasionally
    if (F % 10 === 0 && ROOMS[0]) {
      const rm = ROOMS[0];
      const cfx = rm.x + Math.random() * rm.w;
      const cfy = rm.y + Math.random() * rm.h;
      spawnP(cfx, cfy, 1, { col: '#550000', spd: 0.2, life: 1.8, r: 2.5, gv: -0.008 });
    }
  }
};

const _tickProj_orig = tickProjectiles;
tickProjectiles = function(dt) {
  // Handle new special projectile types first
  for (let i = PROJECTILES.length - 1; i >= 0; i--) {
    const pr = PROJECTILES[i];
    if (!pr.fromPlayer) continue;
    if (!pr.piercing && !pr.spearThrow) continue;

    pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life += dt;
    if (F % 4 === 0) spawnP(pr.x, pr.y, 1, { col: pr.spearThrow ? '#38bdf8' : '#c4b5fd', spd: 0.3, life: 0.2, r: 2 });
    const maxLife = pr.spearThrow ? 16 / 12 : 16 / 14;
    if (solidAt(pr.x, pr.y) || pr.life > maxLife) { PROJECTILES.splice(i, 1); continue; }

    let hitAny = false;
    for (let j = ENE.length - 1; j >= 0; j--) {
      const e = ENE[j]; if (!e.alive) continue;
      if (Math.hypot(pr.x - e.x, pr.y - e.y) < 0.55) {
        e.hp -= pr.damage; e.hitFlash = 0.2;
        spawnP(pr.x, pr.y, 8, { col: '#38bdf8', spd: 1.2, life: 0.3, r: 3, star: true });
        if (e.hp <= 0) { killEnemy(e); P.san = Math.min(100, P.san + WD.spear.sg); }
        if (pr.spearThrow) {
          pr.spearHits = (pr.spearHits || 0) + 1;
          if (pr.spearHits >= 3) unlockAchievement('spear_lord');
          hitAny = true;
        }
        if (pr.piercing) {
          pr.piercedCount = (pr.piercedCount || 0) + 1;
          // Bug #11 fix: Only count BOW_KILLS on actual kills, not hits
          if (e.hp <= 0) {
            BOW_KILLS++;
            if (BOW_KILLS >= 50) unlockAchievement('sniper');
          }
          // Don't remove — let it pass through
        } else {
          PROJECTILES.splice(i, 1); hitAny = false; break;
        }
      }
    }
  }
  // Original handles non-special projectiles
  _tickProj_orig(dt);
};

// ── 7. Real-Time Tactical Minimap (Sprint 5) ─────────────────────────
let MINIMAP_VISIBLE = true;
const EXPLORED_ROOMS = new Set();

function updateExploredRooms() {
  if (!ROOMS) return;
  ROOMS.forEach((r, idx) => {
    if (P.x >= r.x && P.x <= r.x + r.w && P.y >= r.y && P.y <= r.y + r.h) {
      EXPLORED_ROOMS.add(idx);
    }
  });
}

function drawMinimap() {
  if (!MINIMAP_VISIBLE || STATE !== 'playing') return;
  const mw = 120, mh = 84;
  const mx = LW - mw - 14, my = 70;

  CX.save();
  // Frame
  CX.fillStyle = 'rgba(5,8,20,0.85)';
  CX.strokeStyle = 'rgba(201,168,76,0.6)';
  CX.lineWidth = 1.2;
  roundRect(CX, mx, my, mw, mh, 6);
  CX.fill(); CX.stroke();

  // Header tag
  CX.fillStyle = 'rgba(201,168,76,0.9)';
  CX.font = 'bold 8px Cinzel, serif';
  CX.textAlign = 'left';
  CX.fillText('MAP [M]', mx + 6, my + 10);

  // Map scale factors (COLS=28, ROWS=20)
  const scX = (mw - 16) / COLS;
  const scY = (mh - 22) / ROWS;
  const ox = mx + 8, oy = my + 16;

  // Draw explored rooms
  CX.fillStyle = 'rgba(71,85,105,0.45)';
  ROOMS.forEach((r, idx) => {
    if (EXPLORED_ROOMS.has(idx) || LV === 10) {
      CX.fillRect(ox + r.x * scX, oy + r.y * scY, r.w * scX, r.h * scY);
    }
  });

  // Exit Portal blip
  if (PORTAL_DISCOVERED || LV === 10) {
    const prx = (ROOMS && ROOMS[ROOMS.length - 1]) ? ROOMS[ROOMS.length - 1].cx : COLS / 2;
    const pry = (ROOMS && ROOMS[ROOMS.length - 1]) ? ROOMS[ROOMS.length - 1].cy : ROWS / 2;
    const pulse = Math.sin(F * 0.15) * 0.4 + 0.6;
    CX.fillStyle = `rgba(34,197,94,${pulse})`;
    CX.beginPath();
    CX.arc(ox + prx * scX, oy + pry * scY, 3, 0, 6.28);
    CX.fill();
  }

  // Mini-Boss / Boss blip
  if (ACTIVE_MINIBOSS && ACTIVE_MINIBOSS.alive) {
    CX.fillStyle = '#ef4444';
    CX.beginPath();
    CX.arc(ox + ACTIVE_MINIBOSS.x * scX, oy + ACTIVE_MINIBOSS.y * scY, 3.5, 0, 6.28);
    CX.fill();
  } else if (LV === 10 && BOSS && BOSS.alive) {
    CX.fillStyle = '#dc2626';
    CX.beginPath();
    CX.arc(ox + BOSS.x * scX, oy + BOSS.y * scY, 4, 0, 6.28);
    CX.fill();
  }

  // Enemy blips
  CX.fillStyle = 'rgba(239,68,68,0.7)';
  ENE.forEach(e => {
    if (e.alive && Math.hypot(P.x - e.x, P.y - e.y) < 7) {
      CX.fillRect(ox + e.x * scX - 1, oy + e.y * scY - 1, 2, 2);
    }
  });

  // Player arrow
  CX.fillStyle = '#38bdf8';
  CX.shadowColor = '#0ea5e9';
  CX.shadowBlur = 6;
  const plx = ox + P.x * scX, ply = oy + P.y * scY;
  CX.beginPath();
  CX.arc(plx, ply, 2.5, 0, 6.28);
  CX.fill();
  CX.restore();
}

// ── 8. High-Fidelity 2.5D Visuals & Ghost HP Bar (Sprint 5) ───────────
function drawCosmicPortalVortex(px, py, pcx, pcy, locked, puls) {
  // Cosmic Event Horizon Whirlpool
  CX.save();
  const grad = CX.createRadialGradient(pcx, pcy, 2, pcx, pcy, T * 0.9 * puls);
  grad.addColorStop(0, locked ? 'rgba(255,50,50,0.45)' : 'rgba(0,255,180,0.45)');
  grad.addColorStop(0.5, locked ? 'rgba(120,0,0,0.25)' : 'rgba(0,80,200,0.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  CX.fillStyle = grad;
  CX.beginPath();
  CX.arc(pcx, pcy, T * 0.9 * puls, 0, 6.28);
  CX.fill();

  // Counter-rotating runic rings
  const ring1Ang = F * 0.03;
  const ring2Ang = -F * 0.045;
  CX.strokeStyle = `rgba(${locked ? '255,80,80' : '0,255,180'},0.75)`;
  CX.lineWidth = 1.8;
  CX.beginPath();
  CX.arc(pcx, pcy, T * 0.42 * puls, ring1Ang, ring1Ang + 4.8);
  CX.stroke();

  CX.strokeStyle = `rgba(${locked ? '200,30,30' : '56,189,248'},0.65)`;
  CX.lineWidth = 1.4;
  CX.beginPath();
  CX.arc(pcx, pcy, T * 0.28 * puls, ring2Ang, ring2Ang + 4.2);
  CX.stroke();

  // Dark singularity core
  CX.fillStyle = '#050814';
  CX.beginPath();
  CX.arc(pcx, pcy, T * 0.16 * puls, 0, 6.28);
  CX.fill();
  CX.restore();
}

function updateGhostHealth(dt) {
  if (P.ghostHp === undefined) P.ghostHp = P.hp;
  if (P.ghostHpTimer === undefined) P.ghostHpTimer = 0;

  if (P.ghostHpTimer > 0) {
    P.ghostHpTimer -= dt;
  } else if (P.ghostHp > P.displayHp) {
    P.ghostHp = Math.max(P.displayHp, P.ghostHp - dt * (P.maxHp * 0.4));
  } else {
    P.ghostHp = P.displayHp;
  }
}

// ── 10. Soul Orbs System ─────────────────────────────────────────────
const SOUL_ORBS = [];
function spawnSoulOrb(x, y, count = 1) {
  let finalCount = count;
  if (hasRelic('blood_chalice')) finalCount = Math.round(count * 1.5);
  SOUL_ORBS.push({
    x, y,
    vx: (Math.random() - 0.5) * 2.5,
    vy: (Math.random() - 0.5) * 2.5,
    count: finalCount,
    life: 12.0,
    ph: Math.random() * 6.28
  });
}

function tickSoulOrbs(dt) {
  const attractRange = hasRelic('void_magnet') ? 10.0 : 4.0;
  for (let i = SOUL_ORBS.length - 1; i >= 0; i--) {
    const orb = SOUL_ORBS[i];
    orb.life -= dt;
    orb.ph += dt * 4;
    const dx = P.x - orb.x, dy = P.y - orb.y;
    const dist = Math.hypot(dx, dy) || 1;
    const pullSpeed = dist < attractRange ? 7.5 : 2.0;
    orb.vx += (dx / dist) * pullSpeed * dt;
    orb.vy += (dy / dist) * pullSpeed * dt;
    orb.vx *= Math.pow(0.88, dt * TARGET_FPS);
    orb.vy *= Math.pow(0.88, dt * TARGET_FPS);
    orb.x += orb.vx * dt;
    orb.y += orb.vy * dt;

    if (dist < 0.65 && !P.dead) {
      ABYSS_SOULS += orb.count;
      saveSouls();
      SoundManager.snd('soul_pickup');
      showFloatingText('+' + orb.count + ' 🔮', P.x, P.y - 0.4, '#c084fc', 13);
      spawnP(orb.x, orb.y, 6, { col: '#c084fc', spd: 1.0, life: 0.4, r: 2.2, star: true });
      SOUL_ORBS.splice(i, 1);
    } else if (orb.life <= 0) {
      SOUL_ORBS.splice(i, 1);
    }
  }
}

function drawSoulOrbs() {
  if (SOUL_ORBS.length === 0) return;
  CX.save();
  SOUL_ORBS.forEach(orb => {
    const ox = (orb.x + 0.5) * T, oy = (orb.y + 0.5) * T + Math.sin(orb.ph) * 3;
    const puls = Math.sin(orb.ph * 2) * 0.3 + 0.7;
    CX.shadowColor = '#a855f7';
    CX.shadowBlur = 10 * puls;
    CX.fillStyle = '#c084fc';
    CX.beginPath();
    CX.arc(ox, oy, 4 * puls, 0, 6.28);
    CX.fill();
    CX.fillStyle = '#ffffff';
    CX.beginPath();
    CX.arc(ox, oy, 2 * puls, 0, 6.28);
    CX.fill();
  });
  CX.restore();
}

          CX.fillStyle = dropGrad;
          CX.fillRect(px, py, T, 10);
        }

          sideGrad.addColorStop(0, 'rgba(0,0,0,0.30)');
          sideGrad.addColorStop(1, 'rgba(0,0,0,0)');

          CX.fillRect(px, py, 8, T);

// ── 12. Mini-Bosses & Epic Boss Encounters ───────────────────────────
let ACTIVE_MINIBOSS = null;

function spawnMiniBoss(type) {
  if (!ROOMS || ROOMS.length === 0) return;
  const targetRoom = ROOMS[Math.min(ROOMS.length - 1, 3)];
  const x = targetRoom.cx, y = targetRoom.cy;

  if (type === 'iron_warden') {
    ACTIVE_MINIBOSS = {
      type: 'iron_warden',
      name: 'GORGAROTH',
      title: 'The Iron Warden',
      x, y, vx: 0, vy: 0,
      hp: 16, maxHp: 16,
      alive: true,
      alertT: 0, atkC: 0,
      slamTimer: 3.5,
      slamTelegraph: 0,
      slamX: 0, slamY: 0,
      ph: 0, dAnim: 0, hitFlash: 0
    };
    triggerCinematicBanner('GORGAROTH', '— The Iron Warden —', '#ef4444');
    SoundManager.snd('miniboss_roar');
  } else if (type === 'void_reaver') {
    ACTIVE_MINIBOSS = {
      type: 'void_reaver',
      name: 'MALAKOR',
      title: 'The Void Reaver',
      x, y, vx: 0, vy: 0,
      hp: 22, maxHp: 22,
      alive: true,
      alertT: 0, atkC: 0,
      barrageTimer: 2.8,
      teleportTimer: 4.5,
      ph: 0, dAnim: 0, hitFlash: 0
    };
    triggerCinematicBanner('MALAKOR', '— The Void Reaver —', '#a855f7');
    SoundManager.snd('miniboss_roar');
  }
}

function tickMiniBoss(dt) {
  const mb = ACTIVE_MINIBOSS;
  if (!mb || !mb.alive) return;
  mb.ph += dt * 3;
  if (mb.atkC > 0) mb.atkC -= dt;
  if (mb.hitFlash > 0) mb.hitFlash = Math.max(0, mb.hitFlash - dt);

  const dx = P.x - mb.x, dy = P.y - mb.y, dist = Math.hypot(dx, dy) || 1;

  if (mb.type === 'iron_warden') {
    if (dist > 1.2 && mb.slamTelegraph <= 0) {
      mb.vx += (dx / dist) * 1.8 * dt;
      mb.vy += (dy / dist) * 1.8 * dt;
    }
    mb.vx *= Math.pow(0.85, dt * TARGET_FPS);
    mb.vy *= Math.pow(0.85, dt * TARGET_FPS);
    if (!solidAt(mb.x + mb.vx, mb.y)) mb.x += mb.vx;
    if (!solidAt(mb.x, mb.y + mb.vy)) mb.y += mb.vy;

    mb.slamTimer -= dt;
    if (mb.slamTimer <= 0.75 && mb.slamTelegraph <= 0) {
      mb.slamTelegraph = 0.75;
      mb.slamX = P.x; mb.slamY = P.y;
      SoundManager.snd('shockwave');
    }
    if (mb.slamTelegraph > 0) {
      mb.slamTelegraph -= dt;
      if (mb.slamTelegraph <= 0) {
        shk(12);
        SoundManager.snd('shockwave');
        spawnP(mb.slamX, mb.slamY, 30, { col: '#ef4444', spd: 1.8, life: 0.6, r: 3.5, star: true });
        spawnRing(mb.slamX, mb.slamY, '#ef4444');
        if (Math.hypot(P.x - mb.slamX, P.y - mb.slamY) < 2.2 && !P.shieldActive && P.dcd <= 0 && !P.dead) {
          playerTakeDamage(2);
          P.vx += (P.x - mb.slamX) * 7; P.vy += (P.y - mb.slamY) * 7;
          showFloatingText('CRUSH! -2', P.x, P.y - 0.5, '#ef4444', 15, true);
        }
        mb.slamTimer = 3.8;
      }
    }
    if (dist < 0.9 && mb.atkC <= 0 && !P.dead) {
      mb.atkC = 1.2;
      playerTakeDamage(1);
    }
  } else if (mb.type === 'void_reaver') {
    mb.vx += (dx / dist) * 1.2 * dt;
    mb.vy += (dy / dist) * 1.2 * dt;
    mb.vx *= Math.pow(0.88, dt * TARGET_FPS);
    mb.vy *= Math.pow(0.88, dt * TARGET_FPS);
    if (!solidAt(mb.x + mb.vx, mb.y)) mb.x += mb.vx;
    if (!solidAt(mb.x, mb.y + mb.vy)) mb.y += mb.vy;

    mb.barrageTimer -= dt;
    if (mb.barrageTimer <= 0) {
      mb.barrageTimer = 3.6;
      SoundManager.snd('boss_roar');
      for (let i = -1; i <= 1; i++) {
        const ang = Math.atan2(dy, dx) + i * 0.28;
        PROJECTILES.push({
          x: mb.x, y: mb.y,
          vx: Math.cos(ang) * 7.5, vy: Math.sin(ang) * 7.5,
          life: 0, maxLife: 4, damage: 1,
          fromPlayer: false, hit: false, isBoss: true
        });
      }
      spawnP(mb.x, mb.y, 14, { col: '#a855f7', spd: 1.2, life: 0.5, r: 3, star: true });
    }

    mb.teleportTimer -= dt;
    if (mb.teleportTimer <= 0) {
      mb.teleportTimer = 5.2;
      const tx = P.x - (P.fx || 1) * 1.8;
      const ty = P.y - (P.fy || 0) * 1.8;
      if (!solidAt(tx, ty)) {
        spawnP(mb.x, mb.y, 16, { col: '#7c3aed', spd: 1.4, life: 0.6, r: 3 });
        mb.x = tx; mb.y = ty;
        spawnP(mb.x, mb.y, 16, { col: '#a855f7', spd: 1.4, life: 0.6, r: 3, star: true });
        SoundManager.snd('boss_roar');
        shk(5);
      }
    }
  }
}

function drawMiniBoss() {
  const mb = ACTIVE_MINIBOSS;
  if (!mb || !mb.alive) return;
  const bx = (mb.x + 0.5) * T, by = (mb.y + 0.5) * T;

  CX.save();
  if (mb.type === 'iron_warden' && mb.slamTelegraph > 0) {
    const sx = (mb.slamX + 0.5) * T, sy = (mb.slamY + 0.5) * T;
    const progress = 1 - (mb.slamTelegraph / 0.75);
    CX.strokeStyle = '#ef4444';
    CX.lineWidth = 2.5;
    CX.beginPath();
    CX.arc(sx, sy, T * 2.2 * progress, 0, 6.28);
    CX.stroke();

    CX.fillStyle = `rgba(239,68,68,${0.12 + progress * 0.18})`;
    CX.beginPath();
    CX.arc(sx, sy, T * 2.2 * progress, 0, 6.28);
    CX.fill();
  }

  CX.fillStyle = 'rgba(0,0,0,0.5)';
  CX.beginPath();
  CX.ellipse(bx, by + 16, 20, 6, 0, 0, 6.28);
  CX.fill();

  if (mb.type === 'iron_warden') {
    const bob = Math.sin(F * 0.12) * 2;
    CX.fillStyle = mb.hitFlash > 0 ? '#ffffff' : '#334155';
    roundRect(CX, bx - 14, by - 16 + bob, 28, 28, 6);
    CX.fill();

    CX.fillStyle = '#94a3b8';
    CX.beginPath();
    CX.moveTo(bx - 10, by - 14 + bob); CX.lineTo(bx - 22, by - 26 + bob); CX.lineTo(-6 + bx, by - 16 + bob); CX.fill();
    CX.beginPath();
    CX.moveTo(bx + 10, by - 14 + bob); CX.lineTo(bx + 22, by - 26 + bob); CX.lineTo(6 + bx, by - 16 + bob); CX.fill();

    CX.fillStyle = '#f97316';
    CX.shadowColor = '#ea580c';
    CX.shadowBlur = 8;
    CX.fillRect(bx - 7, by - 6 + bob, 4, 3);
    CX.fillRect(bx + 3, by - 6 + bob, 4, 3);

    CX.shadowBlur = 0;
    CX.fillStyle = '#64748b';
    CX.fillRect(bx + 14, by - 10 + bob, 6, 26);
    CX.fillStyle = '#94a3b8';
    CX.beginPath();
    CX.arc(bx + 17, by - 10 + bob, 7, 0, 6.28);
    CX.fill();
  } else if (mb.type === 'void_reaver') {
    const floatY = Math.sin(F * 0.1) * 4;
    CX.fillStyle = mb.hitFlash > 0 ? '#ffffff' : '#1e1b4b';
    CX.shadowColor = '#7c3aed';
    CX.shadowBlur = 14;
    CX.beginPath();
    CX.arc(bx, by - 4 + floatY, 15, 0, 6.28);
    CX.fill();

    for (let w = 0; w < 3; w++) {
      const ang = mb.ph + (w * Math.PI * 2) / 3;
      const wx = bx + Math.cos(ang) * 22;
      const wy = by - 4 + floatY + Math.sin(ang) * 14;
      CX.fillStyle = '#c084fc';
      CX.beginPath();
      CX.arc(wx, wy, 3, 0, 6.28);
      CX.fill();
    }

    CX.fillStyle = '#c084fc';
    CX.beginPath();
    CX.arc(bx, by - 4 + floatY, 4, 0, 6.28);
    CX.fill();
  }
  CX.restore();
}

// ── 13. Cinematic Encounter Banners ──────────────────────────────────
const CINEMATIC_BANNER = {
  active: false,
  timer: 0,
  duration: 3.5,
  title: '',
  subtitle: '',
  col: '#fde68a'
};

function triggerCinematicBanner(title, subtitle, col = '#fde68a') {
  CINEMATIC_BANNER.active = true;
  CINEMATIC_BANNER.timer = 0;
  CINEMATIC_BANNER.title = title;
  CINEMATIC_BANNER.subtitle = subtitle;
  CINEMATIC_BANNER.col = col;
}

function tickCinematicBanner(dt) {
  if (!CINEMATIC_BANNER.active) return;
  CINEMATIC_BANNER.timer += dt;
  if (CINEMATIC_BANNER.timer >= CINEMATIC_BANNER.duration) {
    CINEMATIC_BANNER.active = false;
  }
}

function drawCinematicBanner() {
  if (!CINEMATIC_BANNER.active) return;
  const cb = CINEMATIC_BANNER;
  const t = cb.timer;
  let alpha = 1;
  if (t < 0.5) alpha = t / 0.5;
  else if (t > cb.duration - 0.6) alpha = (cb.duration - t) / 0.6;

  CX.save();
  CX.globalAlpha = Math.max(0, Math.min(1, alpha));

  const lbH = 46;
  CX.fillStyle = 'rgba(2,4,12,0.92)';
  CX.fillRect(0, 0, LW, lbH);
  CX.fillRect(0, LH - lbH, LW, lbH);

  const py = 76, pw = 480, ph = 58;
  const px = LW / 2 - pw / 2;
  const grad = CX.createLinearGradient(px, py, px + pw, py);
  grad.addColorStop(0, 'rgba(10,12,24,0)');
  grad.addColorStop(0.2, 'rgba(15,20,40,0.95)');
  grad.addColorStop(0.8, 'rgba(15,20,40,0.95)');
  grad.addColorStop(1, 'rgba(10,12,24,0)');
  CX.fillStyle = grad;
  CX.fillRect(px, py, pw, ph);

  CX.strokeStyle = cb.col;
  CX.lineWidth = 1.2;
  CX.beginPath();
  CX.moveTo(px + 40, py); CX.lineTo(px + pw - 40, py);
  CX.moveTo(px + 40, py + ph); CX.lineTo(px + pw - 40, py + ph);
  CX.stroke();

  CX.shadowColor = cb.col;
  CX.shadowBlur = 14;
  CX.fillStyle = cb.col;
  CX.font = 'bold 20px Cinzel, serif';
  CX.textAlign = 'center';
  CX.textBaseline = 'middle';
  CX.fillText(cb.title, LW / 2, py + 22);

  CX.shadowBlur = 0;
  CX.fillStyle = 'rgba(226,232,240,0.85)';
  CX.font = 'italic 12px Crimson Text, serif';
  CX.fillText(cb.subtitle, LW / 2, py + 44);

  CX.restore();
}

function handleCodexClick(mx, my) {
  const panW = 600, panH = 550;
  const panX = LW / 2 - panW / 2, panY = LH / 2 - panH / 2;

  // Close button
  const closeBtnW = 180, closeBtnH = 34;
  const closeX = LW / 2 - closeBtnW / 2, closeY = panY + panH - 46;
  if (mx >= closeX && mx <= closeX + closeBtnW && my >= closeY && my <= closeY + closeBtnH) {
    STATE = 'title';
    return true;
  }

  // Tabs
  const tabW = (panW - 64) / 3;
  const tab1X = panX + 20, tab2X = panX + 26 + tabW, tab3X = panX + 32 + tabW * 2;
  const tabY = panY + 44, tabH = 32;

  if (mx >= tab1X && mx <= tab1X + tabW && my >= tabY && my <= tabY + tabH) {
    CODEX_TAB = 'lore';
    SoundManager.snd('talent_unlock');
    return true;
  }
  if (mx >= tab2X && mx <= tab2X + tabW && my >= tabY && my <= tabY + tabH) {
    CODEX_TAB = 'bestiary';
    SoundManager.snd('talent_unlock');
    return true;
  }
  if (mx >= tab3X && mx <= tab3X + tabW && my >= tabY && my <= tabY + tabH) {
    CODEX_TAB = 'memories';
    SoundManager.snd('talent_unlock');
    return true;
  }

  // Clicking an unlocked lore entry opens it in full view
  if (CODEX_TAB === 'lore') {
    const itemH = 46, gap = 6;
    const contentY = tabY + tabH + 12;
    for (let i = 0; i < LORE_SCROLLS_DATA.length; i++) {
      const iy = contentY + i * (itemH + gap);
      if (mx >= panX + 24 && mx <= panX + panW - 24 && my >= iy && my <= iy + itemH) {
        const scroll = LORE_SCROLLS_DATA[i];
        if (UNLOCKED_LORE[scroll.id]) {
          CODEX_SELECTED_LORE = i;
          openLoreModal(scroll);
          return true;
        }
      }
    }
  }

  if (mx < panX || mx > panX + panW || my < panY || my > panY + panH) {
    STATE = 'title';
    return true;
  }
  return false;
}

function handleSanctumClick(mx, my) {
  const panW = 560, panH = 550;
  const panX = LW / 2 - panW / 2, panY = LH / 2 - panH / 2;

  const closeBtnW = 180, closeBtnH = 34;
  const closeX = LW / 2 - closeBtnW / 2, closeY = panY + panH - 46;
  if (mx >= closeX && mx <= closeX + closeBtnW && my >= closeY && my <= closeY + closeBtnH) {
    STATE = 'title';
    return true;
  }

  const talentKeys = Object.keys(TALENT_DEFS);
  const cardW = panW - 40, cardH = 72, gap = 8;
  const startY = panY + 74;

  for (let idx = 0; idx < talentKeys.length; idx++) {
    const key = talentKeys[idx];
    const tDef = TALENT_DEFS[key];
    const rank = getTalentRank(key);
    const cy = startY + idx * (cardH + gap);
    const btnX = panX + cardW - 134, btnY = cy + 16, btnW = 120, btnH = 40;

    if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
      if (rank < tDef.max) {
        const cost = tDef.costs[rank];
        if (ABYSS_SOULS >= cost) {
          ABYSS_SOULS -= cost;
          TALENTS[key] = rank + 1;
          saveSouls();
          saveTalents();
          SoundManager.snd('talent_unlock');
          shk(4);
          return true;
        }
      }
    }
  }

  if (mx < panX || mx > panX + panW || my < panY || my > panY + panH) {
    STATE = 'title';
    return true;
  }
  return false;
}

  const mw = 460, mh = 220;

// Hook into doAttack for fury damage, affixes, slash arcs, and floating text
const _da_omni_orig = doAttack;
doAttack = function() {
  if (!P.wep || P.acd > 0 || P.dead) return;
  const w = WD[P.wep];
  if (w && !w.projectile) {
    const ang = Math.atan2(P.fy, P.fx);
    spawnSlashArc(P.x, P.y, ang, w.arc * 1.3, w.col || '#f59e0b', (w.range || 1.3) * T);
  }

  // Check hit on Mini-Boss if alive
  const mb = ACTIVE_MINIBOSS;
  if (mb && mb.alive && w) {
    const dist = Math.hypot(P.x - mb.x, P.y - mb.y);
    if (dist < (w.range || 1.4) + 0.4) {
      const furyMult = 1 + getTalentRank('fury') * 0.15;
      let dmg = Math.max(1, Math.round((w.dmg || 1) * rarityDmgMult(P.wepRarity) * furyMult));
      if (P.activePrefix && P.activePrefix.id === 'cursed') {
        dmg = Math.round(dmg * 1.4);
        P.san = Math.max(0, P.san - 1);
      }
      mb.hp -= dmg;
      mb.hitFlash = 0.2;
      showFloatingText('-' + dmg, mb.x, mb.y - 0.6, '#fde68a', 14, true);
      SoundManager.snd('melee_hit');
      shk(5);
      if (mb.hp <= 0) {
        mb.alive = false;
        shk(16);
        SoundManager.snd('enemy_death');
        const dropSouls = mb.type === 'void_reaver' ? 15 : 8;
        spawnSoulOrb(mb.x, mb.y, dropSouls);
        showFloatingText('+' + dropSouls + ' 🔮', mb.x, mb.y - 0.8, '#c084fc', 16, true);

        // Guaranteed relic drop
        const relicsPool = Object.keys(RELIC_DEFS).filter(k => !hasRelic(k));
        if (relicsPool.length > 0) {
          const rId = relicsPool[(Math.random() * relicsPool.length) | 0];
          P.relics.push(rId);
          showFloatingText('RELIC: ' + RELIC_DEFS[rId].name, mb.x, mb.y - 1.2, RELIC_DEFS[rId].col, 15, true);
        }

        if (mb.type === 'iron_warden') unlockAchievement('jailbreaker');
        if (mb.type === 'void_reaver') unlockAchievement('void_conqueror');
      }
    }
  }

  // Normal attack
  _da_omni_orig();

  // Siphon talent check
  const siphonChance = getTalentRank('siphon') * 0.05 + (P.activePrefix && P.activePrefix.id === 'vampiric' ? 0.15 : 0);
  if (siphonChance > 0 && Math.random() < siphonChance) {
    if (P.hp < P.maxHp) {
      P.hp = Math.min(P.maxHp, P.hp + 1);
      showFloatingText('+1 ❤', P.x, P.y - 0.5, '#22c55e', 14);
    }
  }
};

let WARP_ACTIVE = false;
let WARP_TIMER = 0;
let WARP_DUR = 1.8;
let WARP_QUOTE = '';
let WARP_NEXT_LV = 1;

function startCosmicHyperWarp(nextLv) {
  WARP_ACTIVE = true;
  WARP_TIMER = 0;
  WARP_NEXT_LV = nextLv;
  WARP_QUOTE = FLOOR_WARP_QUOTES[Math.min(FLOOR_WARP_QUOTES.length - 1, Math.max(0, LV - 1))];
  PORTAL_USED = true;
  SoundManager.snd('shockwave');
  shk(10);
  if (!LEVEL_TOOK_DAMAGE) unlockAchievement('untouchable');
  if (LEVEL_TIMER < 90) unlockAchievement('speed_runner');
  saveGame();
}

function tickCosmicHyperWarp(dt) {
  if (!WARP_ACTIVE) return;
  WARP_TIMER += dt;

  // Midpoint level swap
  if (WARP_TIMER >= 0.95 && LV !== WARP_NEXT_LV) {
    LV = WARP_NEXT_LV;
    loadLevel();
    AFL = 0.45; // Radiant white burst
    shk(8);
  }

  // End of warp
  if (WARP_TIMER >= WARP_DUR) {
    WARP_ACTIVE = false;
    PORTAL_USED = false;
    if (isBossFloor(LV)) {
      startBossIntroCinematic(FLOOR_CONFIG[LV].boss);
    } else {
      STATE = 'playing';
      GAME_MSG = 'Level ' + LV + ' — ' + (FLOOR_CONFIG[LV] ? FLOOR_CONFIG[LV].name : 'Biome') + ' — Find the portal.';
      GAME_MSG_TIMER = 4.5;
    }
  }
}

function drawCosmicHyperWarp() {
  if (!WARP_ACTIVE) return;
  const progress = Math.min(1, WARP_TIMER / WARP_DUR);
  const cx = LW / 2, cy = LH / 2;

  CX.save();

  // Dark dimensional backdrop
  const bgAlpha = Math.min(0.95, progress * 2.2);
  CX.fillStyle = `rgba(3,5,15,${bgAlpha})`;
  CX.fillRect(0, 0, LW, LH);

  // Radial lightspeed streaks
  const numStreaks = 42;
  const maxR = Math.hypot(LW / 2, LH / 2);

  CX.lineWidth = 1.8;
  for (let i = 0; i < numStreaks; i++) {
    const ang = (i / numStreaks) * Math.PI * 2 + progress * 2.5;
    const rStart = 30 + Math.sin(i * 3 + F * 0.1) * 20;
    const rEnd = rStart + (maxR - rStart) * Math.min(1, progress * 1.6 + 0.2);

    const grad = CX.createLinearGradient(
      cx + Math.cos(ang) * rStart, cy + Math.sin(ang) * rStart,
      cx + Math.cos(ang) * rEnd,   cy + Math.sin(ang) * rEnd
    );
    const col = i % 3 === 0 ? '#38bdf8' : i % 3 === 1 ? '#c084fc' : '#fde68a';
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.5, col);
    grad.addColorStop(1, 'rgba(255,255,255,0.85)');

    CX.strokeStyle = grad;
    CX.beginPath();
    CX.moveTo(cx + Math.cos(ang) * rStart, cy + Math.sin(ang) * rStart);
    CX.lineTo(cx + Math.cos(ang) * rEnd, cy + Math.sin(ang) * rEnd);
    CX.stroke();
  }

  // Counter-rotating singularity rings
  const ring1 = progress * 6;
  const ring2 = -progress * 8;
  CX.strokeStyle = 'rgba(56,189,248,0.7)';
  CX.lineWidth = 2.5;
  CX.beginPath();
  CX.arc(cx, cy, 60 + Math.sin(progress * Math.PI) * 40, ring1, ring1 + 4.5);
  CX.stroke();

  CX.strokeStyle = 'rgba(192,132,252,0.75)';
  CX.lineWidth = 2.0;
  CX.beginPath();
  CX.arc(cx, cy, 40 + Math.sin(progress * Math.PI) * 25, ring2, ring2 + 4.5);
  CX.stroke();

  // Dark core
  const coreG = CX.createRadialGradient(cx, cy, 5, cx, cy, 80);
  coreG.addColorStop(0, '#ffffff');
  coreG.addColorStop(0.2, '#38bdf8');
  coreG.addColorStop(0.6, '#090d24');
  coreG.addColorStop(1, 'rgba(3,5,15,0)');
  CX.fillStyle = coreG;
  CX.beginPath();
  CX.arc(cx, cy, 80, 0, 6.28);
  CX.fill();

  // Story Monologue Quote Banner
  const quoteAlpha = Math.sin(progress * Math.PI);
  if (quoteAlpha > 0.1 && WARP_QUOTE) {
    CX.save();
    CX.globalAlpha = quoteAlpha;

    // Cinematic Cinemascope Bars
    const barH = 50 * quoteAlpha;
    CX.fillStyle = 'rgba(0,0,0,0.92)';
    CX.fillRect(0, 0, LW, barH);
    CX.fillRect(0, LH - barH, LW, barH);

    // Gold divider lines
    CX.strokeStyle = 'rgba(201,168,76,0.6)';
    CX.lineWidth = 1;
    CX.beginPath();
    CX.moveTo(LW * 0.15, barH); CX.lineTo(LW * 0.85, barH);
    CX.moveTo(LW * 0.15, LH - barH); CX.lineTo(LW * 0.85, LH - barH);
    CX.stroke();

    // Narrative Text
    CX.fillStyle = '#fde68a';
    CX.font = 'bold 13px Cinzel, serif';
    CX.textAlign = 'center';
    CX.textBaseline = 'middle';
    CX.shadowColor = '#c9a84c';
    CX.shadowBlur = 10;
    CX.fillText('LORD ROWAN — INNER MONOLOGUE', LW / 2, cy - 35);
    CX.shadowBlur = 0;

    CX.fillStyle = '#ffffff';
    CX.font = 'italic 15px Crimson Text, serif';
    CX.fillText('“' + WARP_QUOTE + '”', LW / 2, cy + 30);
    CX.restore();
  }

  CX.restore();
}

// ── 3. Hit-Stop, Chromatic Aberration & Shockwaves ────────────────────
let HIT_STOP_TIMER = 0;
function triggerHitStop(dur = 0.06) {
  HIT_STOP_TIMER = Math.max(HIT_STOP_TIMER, dur);
}

const IMPACT_SHOCKWAVES = [];
function spawnImpactShockwave(x, y, col = '#fde68a', maxR = 48) {
  IMPACT_SHOCKWAVES.push({
    x: (x + 0.5) * T,
    y: (y + 0.5) * T,
    r: 4,
    maxR,
    col,
    life: 0.35,
    maxLife: 0.35
  });
}

function tickImpactShockwaves(dt) {
  if (HIT_STOP_TIMER > 0) {
    HIT_STOP_TIMER = Math.max(0, HIT_STOP_TIMER - dt);
  }
  for (let i = IMPACT_SHOCKWAVES.length - 1; i >= 0; i--) {
    const sw = IMPACT_SHOCKWAVES[i];
    sw.life -= dt;
    sw.r += (sw.maxR - sw.r) * Math.min(1, dt * 12);
    if (sw.life <= 0) IMPACT_SHOCKWAVES.splice(i, 1);
  }
}

function drawImpactShockwaves() {
  if (IMPACT_SHOCKWAVES.length === 0) return;
  CX.save();
  IMPACT_SHOCKWAVES.forEach(sw => {
    const prog = Math.max(0, sw.life / sw.maxLife);
    CX.globalAlpha = prog * 0.85;
    CX.strokeStyle = sw.col;
    CX.lineWidth = 2.5 * prog;
    CX.shadowColor = sw.col;
    CX.shadowBlur = 8 * prog;
    CX.beginPath();
    CX.arc(sw.x, sw.y, sw.r, 0, 6.28);
    CX.stroke();

    // Subtle chromatic split ring
    CX.strokeStyle = '#38bdf8';
    CX.lineWidth = 1.0 * prog;
    CX.beginPath();
    CX.arc(sw.x, sw.y, sw.r + 2, 0, 6.28);
    CX.stroke();
  });
  CX.restore();
}

// ── 4. Low-Sanity Eldritch Hallucinations & Low-HP Pulse ───────────────
function drawAtmosphericHorrorFX() {
  if (STATE !== 'playing') return;

  // Low HP Heartbeat Pulse
  if (P.hp <= 2 && !P.dead) {
    const pulse = Math.sin(F * 0.18) * 0.5 + 0.5;
    const hbGrad = CX.createRadialGradient(LW / 2, LH / 2, LW * 0.25, LW / 2, LH / 2, LW * 0.72);
    hbGrad.addColorStop(0, 'rgba(0,0,0,0)');
    hbGrad.addColorStop(0.7, `rgba(185,28,28,${pulse * 0.22})`);
    hbGrad.addColorStop(1, `rgba(127,29,29,${0.35 + pulse * 0.35})`);
    CX.fillStyle = hbGrad;
    CX.fillRect(0, 0, LW, LH);
  }

  // Low Sanity Creeping Eldritch Tentacles & Fog
  if (P.san < 35 && !P.dead) {
    const sanFactor = (35 - P.san) / 35;
    CX.save();
    CX.globalAlpha = sanFactor * 0.45;

    // Corner shadow tendrils
    const tendrilPulse = Math.sin(F * 0.08) * 15;
    CX.fillStyle = '#0f051d';
    // Top-Left
    CX.beginPath();
    CX.moveTo(0, 0);
    CX.bezierCurveTo(80 + tendrilPulse, 20, 30, 80 + tendrilPulse, 0, 110);
    CX.fill();
    // Top-Right
    CX.beginPath();
    CX.moveTo(LW, 0);
    CX.bezierCurveTo(LW - 80 - tendrilPulse, 20, LW - 30, 80 + tendrilPulse, LW, 110);
    CX.fill();
    // Bottom-Left
    CX.beginPath();
    CX.moveTo(0, LH);
    CX.bezierCurveTo(80 + tendrilPulse, LH - 20, 30, LH - 80 - tendrilPulse, 0, LH - 110);
    CX.fill();
    // Bottom-Right
    CX.beginPath();
    CX.moveTo(LW, LH);
    CX.bezierCurveTo(LW - 80 - tendrilPulse, LH - 20, LW - 30, LH - 80 - tendrilPulse, LW, LH - 110);
    CX.fill();

    // Blinking phantom eyes in darkness
    if (Math.sin(F * 0.05) > 0.4) {
      const eyeX = (P.x + Math.sin(F * 0.03) * 6) * T;
      const eyeY = (P.y + Math.cos(F * 0.03) * 5) * T;
      CX.fillStyle = '#ef4444';
      CX.shadowColor = '#dc2626';
      CX.shadowBlur = 8;
      CX.beginPath(); CX.ellipse(eyeX - 6, eyeY, 3, 1.5, 0, 0, 6.28); CX.fill();
      CX.beginPath(); CX.ellipse(eyeX + 6, eyeY, 3, 1.5, 0, 0, 6.28); CX.fill();
    }

    CX.restore();
  }
}

// ── 5. Memory Echo Interlude Modal ────────────────────────────────────

  MEMORY_ECHO_ANIM_T = Math.min(1, MEMORY_ECHO_ANIM_T + DT * 4.0);

  const panW = 540, panH = 340;
  const panX = LW / 2 - panW / 2, panY = LH / 2 - panH / 2 - (1 - MEMORY_ECHO_ANIM_T) * 40;

  CX.save();
  CX.globalAlpha = MEMORY_ECHO_ANIM_T;

  // Dream haze background
  CX.fillStyle = 'rgba(5,8,22,0.96)';
  CX.strokeStyle = 'rgba(245,158,11,0.75)';
  CX.lineWidth = 1.8;
  roundRect(CX, panX, panY, panW, panH, 12);
  CX.fill(); CX.stroke();

  // Starlight header
  CX.fillStyle = '#fde68a';
  CX.font = 'bold 16px Cinzel, serif';
  CX.textAlign = 'center';
  CX.textBaseline = 'top';
  CX.shadowColor = '#f59e0b';
  CX.shadowBlur = 12;
  CX.fillText('✨ ' + ACTIVE_MEMORY_ECHO.title, LW / 2, panY + 18);
  CX.shadowBlur = 0;

  // Starlight divider
  CX.strokeStyle = 'rgba(245,158,11,0.35)';
  CX.lineWidth = 1;
  CX.beginPath();
  CX.moveTo(panX + 30, panY + 44);
  CX.lineTo(panX + panW - 30, panY + 44);
  CX.stroke();

  // Quote
  CX.fillStyle = '#ffffff';
  CX.font = 'italic 14px Crimson Text, serif';
  const words = ACTIVE_MEMORY_ECHO.quote.split(' ');
  let line = '', lines = [];

    if (CX.measureText(line + w).width > panW - 60) {

  lines.forEach((l, i) => {
    CX.fillText(l, LW / 2, panY + 62 + i * 22);

  // Lore text
  const loreStartY = panY + 62 + lines.length * 22 + 10;

  CX.font = '11px Crimson Text, serif';
  const lwords = ACTIVE_MEMORY_ECHO.lore.split(' ');
  let lline = '', llines = [];
  lwords.forEach(w => {
    if (CX.measureText(lline + w).width > panW - 60) {
      llines.push(lline); lline = w + ' ';
    } else lline += w + ' ';
  });
  llines.push(lline);
  llines.forEach((l, i) => {
    CX.fillText(l, LW / 2, loreStartY + i * 18);
  });

  // Dual Choices Cards
  const btnW = 220, btnH = 60;
  const btn1X = panX + 30, btn2X = panX + panW - 30 - btnW;
  const btnY = panY + panH - 85;

  // Choice A (Sanity / Healing)
  CX.fillStyle = 'rgba(14,165,233,0.18)';
  CX.strokeStyle = 'rgba(56,189,248,0.7)';
  CX.lineWidth = 1.2;
  roundRect(CX, btn1X, btnY, btnW, btnH, 8);
  CX.fill(); CX.stroke();

  CX.fillStyle = '#38bdf8';
  CX.font = 'bold 11px Cinzel, serif';
  CX.textAlign = 'center'; CX.textBaseline = 'top';
  CX.fillText(ACTIVE_MEMORY_ECHO.choiceA.label, btn1X + btnW / 2, btnY + 12);
  CX.fillStyle = 'rgba(226,232,240,0.85)';
  CX.font = '10px Crimson Text, serif';
  CX.fillText(ACTIVE_MEMORY_ECHO.choiceA.desc, btn1X + btnW / 2, btnY + 34);

  // Choice B (Souls / Combat Fury)
  CX.fillStyle = 'rgba(168,85,247,0.18)';
  CX.strokeStyle = 'rgba(192,132,252,0.7)';
  roundRect(CX, btn2X, btnY, btnW, btnH, 8);
  CX.fill(); CX.stroke();

  CX.fillStyle = '#c084fc';
  CX.font = 'bold 11px Cinzel, serif';
  CX.fillText(ACTIVE_MEMORY_ECHO.choiceB.label, btn2X + btnW / 2, btnY + 12);
  CX.fillStyle = 'rgba(226,232,240,0.85)';
  CX.font = '10px Crimson Text, serif';
  CX.fillText(ACTIVE_MEMORY_ECHO.choiceB.desc, btn2X + btnW / 2, btnY + 34);

  CX.restore();
}

function handleMemoryEchoClick(mx, my) {
  if (!ACTIVE_MEMORY_ECHO) return false;
  const panW = 540, panH = 340;
  const panX = LW / 2 - panW / 2, panY = LH / 2 - panH / 2;
  const btnW = 220, btnH = 60;
  const btn1X = panX + 30, btn2X = panX + panW - 30 - btnW;
  const btnY = panY + panH - 85;

  if (mx >= btn1X && mx <= btn1X + btnW && my >= btnY && my <= btnY + btnH) {
    ACTIVE_MEMORY_ECHO.choiceA.effect();
    ACTIVE_MEMORY_ECHO = null;
    SoundManager.snd('talent_unlock');
    return true;
  }
  if (mx >= btn2X && mx <= btn2X + btnW && my >= btnY && my <= btnY + btnH) {
    ACTIVE_MEMORY_ECHO.choiceB.effect();
    ACTIVE_MEMORY_ECHO = null;
    SoundManager.snd('talent_unlock');
    return true;
  }
  return true; // absorb click while modal open
}
