<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Dungeon Break — Abyss Ascension</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23090514' stroke='%23ca8a04' stroke-width='2'/%3E%3Cpolygon points='16,4 26,16 16,28 6,16' fill='%231f1635' stroke='%23a855f7' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ef4444' stroke='%23fde68a' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23ffffff'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="css/main.css?v=2.4"/>
  <link rel="stylesheet" href="css/mobile.css?v=2.4"/>
  <link rel="stylesheet" href="css/hud.css?v=2.4"/>
  <link rel="stylesheet" href="css/menus.css?v=2.4"/>
  <link rel="stylesheet" href="css/overlays.css?v=2.4"/>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Mobile Landscape Required Prompt Overlay -->
  <div id="rotate-overlay" aria-live="polite">
    <div class="rotate-chassis">
      <div class="rotate-phone-anim" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="76" height="76" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- Outer Phone Chassis with Gold Inset -->
          <rect x="18" y="7" width="28" height="50" rx="5" fill="#150f24" stroke="#d97706" stroke-width="2.5" />
          <rect x="21" y="12" width="22" height="38" rx="2" fill="#090514" stroke="#4a3568" stroke-width="1.2" />
          <!-- Speaker Earpiece -->
          <line x1="28" y1="9.5" x2="36" y2="9.5" stroke="#fde68a" stroke-width="1.8" />
          <!-- Amethyst Home Jewel -->
          <circle cx="32" cy="53" r="1.8" fill="#ffd700" stroke="#f59e0b" stroke-width="0.8" />
          <!-- Dynamic Directional Rotation Trajectory -->
          <path d="M52 24 L58 32 L52 40" fill="none" stroke="#fde68a" stroke-width="2.5" />
          <path d="M56 32 A22 22 0 0 0 32 10" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
        </svg>
      </div>
      <div class="rotate-title">ROTATE YOUR DEVICE</div>
      <div class="rotate-desc">Dungeon Break is best experienced in landscape mode.</div>
      <div class="rotate-sub">Turn your device horizontally to enter the Abyss.</div>
    </div>
  </div>

  <!-- Mobile Touch Overlay Controls -->
  <div id="touch-overlay">
    <div id="joy-zone" class="dpad-container" aria-label="Directional Movement Pad">
      <div id="dpad-cross">
        <div id="dpad-up" class="dpad-arrow" data-dir="up"></div>
        <div id="dpad-left" class="dpad-arrow" data-dir="left"></div>
        <div id="dpad-center"><span class="ctrl-btn-label joy-label">MOVE</span></div>
        <div id="dpad-right" class="dpad-arrow" data-dir="right"></div>
        <div id="dpad-down" class="dpad-arrow" data-dir="down"></div>
      </div>
      <div class="ctrl-resize-handle" id="joy-resize"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M2 7 L2 2 L7 2 M14 9 L14 14 L9 14 M3 3 L13 13"/></svg></div>
    </div>
    <div id="atk-btn" class="combat-touch-btn" aria-label="Attack">
      <span class="ctrl-btn-label">ATTACK</span>
      <div class="ctrl-resize-handle" id="atk-resize"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M2 7 L2 2 L7 2 M14 9 L14 14 L9 14 M3 3 L13 13"/></svg></div>
    </div>
    <div id="shoot-btn" class="combat-touch-btn" aria-label="Bow Shot">
      <span class="ctrl-btn-label">SHOOT</span>
      <div class="ctrl-resize-handle" id="shoot-resize"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M2 7 L2 2 L7 2 M14 9 L14 14 L9 14 M3 3 L13 13"/></svg></div>
    </div>
    <div id="special-btn" class="combat-touch-btn" aria-label="Consecrated Ability (Q)">
      <div id="special-cd-overlay"></div>
      <span id="special-cd-text"></span>
      <span class="ctrl-btn-label">ABILITY</span>
      <div class="ctrl-resize-handle" id="special-resize"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M2 7 L2 2 L7 2 M14 9 L14 14 L9 14 M3 3 L13 13"/></svg></div>
    </div>

    <!-- Dedicated Mobile 3-Slot Weapon Switcher Dock -->
    <div id="mobile-weapon-dock" class="mobile-weapon-dock" aria-label="Weapon Inventory Slots">
      <div class="m-wep-slot active" id="m-slot-0" data-slot="0">
        <span class="m-wep-num">1</span>
        <span class="m-wep-icon"></span>
        <span class="m-wep-name">SWORD</span>
      </div>
      <div class="m-wep-slot" id="m-slot-1" data-slot="1">
        <span class="m-wep-num">2</span>
        <span class="m-wep-icon"></span>
        <span class="m-wep-name">EMPTY</span>
      </div>
      <div class="m-wep-slot empty" id="m-slot-2" data-slot="2">
        <span class="m-wep-num">3</span>
        <span class="m-wep-icon"></span>
        <span class="m-wep-name">EMPTY</span>
      </div>
    </div>
  </div>

  <div id="ctrl-edit-hint">
    <span class="ctrl-hint-text">✦ DRAG BUTTONS TO MOVE · DRAG HANDLES TO RESIZE ✦</span>
    <div class="ctrl-hint-actions">
      <button id="ctrl-reset-btn" type="button">RESET</button>
      <button id="ctrl-done-btn" type="button">DONE</button>
    </div>
  </div>

  <!-- In-Game Map & Pause Control Buttons -->
  <div id="ingame-map-btn" title="Toggle Map"><img src="assets/ui/icon_map.png" alt="Map" class="ingame-hud-icon" draggable="false" /></div>
  <div id="ingame-pause-btn" title="Pause / Settings"><svg viewBox="0 0 20 20" width="18" height="18" fill="none"><rect x="4" y="3" width="4.5" height="14" rx="1.5" fill="#fde68a" stroke="#ca8a04" stroke-width="1.2"/><rect x="11.5" y="3" width="4.5" height="14" rx="1.5" fill="#fde68a" stroke="#ca8a04" stroke-width="1.2"/></svg></div>
  <div id="ingame-speed-panel">
    <div class="sp-title">GAME SPEED</div>
    <div class="sp-row">
      <span class="sp-label">Speed:</span>
      <div class="sp-btn" data-spd="0.5">0.5×</div>
      <div class="sp-btn active" data-spd="1.0">1.0×</div>
      <div class="sp-btn" data-spd="1.5">1.5×</div>
      <div class="sp-btn" data-spd="2.0">2.0×</div>
    </div>
    <div class="sp-resume-btn" id="sp-resume-btn">RESUME GAME</div>
  </div>

  <!-- Modular Application Bootstrap -->
  <script type="module" src="./js/main.js?v=3.3"></script>
</body>
</html>
