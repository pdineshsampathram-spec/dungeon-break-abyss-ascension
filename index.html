<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Dungeon Break — Abyss Ascension</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/mobile.css"/>
  <link rel="stylesheet" href="css/hud.css"/>
  <link rel="stylesheet" href="css/menus.css"/>
  <link rel="stylesheet" href="css/overlays.css"/>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Mobile Touch Overlay Controls -->
  <div id="touch-overlay">
    <div id="joy-zone">
      <div id="joy-bg"></div>
      <div id="joy-knob"></div>
      <div class="ctrl-resize-handle" id="joy-resize">⤡</div>
    </div>
    <div id="atk-btn">
      ⚔️
      <div class="ctrl-resize-handle" id="atk-resize">⤡</div>
    </div>
    <div id="shoot-btn">
      🏹
      <div class="ctrl-resize-handle" id="shoot-resize">⤡</div>
    </div>
    <div id="special-btn">
      ✨
      <div class="ctrl-resize-handle" id="special-resize">⤡</div>
    </div>
  </div>

  <div id="ctrl-edit-hint">✦ DRAG TO MOVE • DRAG ⤡ TO RESIZE • TAP DONE WHEN FINISHED ✦</div>

  <!-- In-Game Pause & Speed Control Panel -->
  <div id="ingame-pause-btn" title="Pause / Settings">⏸</div>
  <div id="ingame-speed-panel">
    <div class="sp-title">⚡ GAME SPEED</div>
    <div class="sp-row">
      <span class="sp-label">Speed:</span>
      <div class="sp-btn" data-spd="0.5">0.5×</div>
      <div class="sp-btn active" data-spd="1.0">1.0×</div>
      <div class="sp-btn" data-spd="1.5">1.5×</div>
      <div class="sp-btn" data-spd="2.0">2.0×</div>
    </div>
    <div class="sp-resume-btn" id="sp-resume-btn">▶ RESUME GAME</div>
  </div>

  <!-- Modular Application Bootstrap -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
