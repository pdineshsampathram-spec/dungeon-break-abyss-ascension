<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Dungeon Break — Abyss Ascension</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>"/>
  <link rel="stylesheet" href="css/main.css?v=2.3"/>
  <link rel="stylesheet" href="css/mobile.css?v=2.3"/>
  <link rel="stylesheet" href="css/hud.css?v=2.3"/>
  <link rel="stylesheet" href="css/menus.css?v=2.3"/>
  <link rel="stylesheet" href="css/overlays.css?v=2.3"/>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Mobile Touch Overlay Controls -->
  <div id="touch-overlay">
    <div id="joy-zone">
      <div id="joy-bg"></div>
      <div id="joy-knob"></div>
      <div class="ctrl-resize-handle" id="joy-resize">⤡</div>
    </div>
    <div id="atk-btn">
      ⚔️
      <div class="ctrl-resize-handle" id="atk-resize">⤡</div>
    </div>
    <div id="shoot-btn">
      🏹
      <div class="ctrl-resize-handle" id="shoot-resize">⤡</div>
    </div>
    <div id="special-btn">
      ✨
      <div class="ctrl-resize-handle" id="special-resize">⤡</div>
    </div>
  </div>

  <div id="ctrl-edit-hint">✦ DRAG TO MOVE • DRAG ⤡ TO RESIZE • TAP DONE WHEN FINISHED ✦</div>

  <!-- In-Game Pause & Speed Control Panel -->
  <div id="ingame-pause-btn" title="Pause / Settings">⏸</div>
  <div id="ingame-speed-panel">
    <div class="sp-title">⚡ GAME SPEED</div>
    <div class="sp-row">
      <span class="sp-label">Speed:</span>
      <div class="sp-btn" data-spd="0.5">0.5×</div>
      <div class="sp-btn active" data-spd="1.0">1.0×</div>
      <div class="sp-btn" data-spd="1.5">1.5×</div>
      <div class="sp-btn" data-spd="2.0">2.0×</div>
    </div>
    <div class="sp-resume-btn" id="sp-resume-btn">▶ RESUME GAME</div>
  </div>

  <!-- Dev/Debug: Floating Ending Test Buttons (Developer tool: enabled via ?debug=true or Ctrl+Shift+E) -->
  <div id="ending-debug-panel" style="
    display: none;
    position: fixed;
    bottom: 12px;
    right: 12px;
    flex-direction: column;
    gap: 6px;
    z-index: 9999;
    pointer-events: auto;
    opacity: 0.85;
    transition: opacity 0.25s ease;
  " onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.85'">
    <div style="
      font-size: 9px;
      color: #94a3b8;
      text-align: center;
      font-family: monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    ">🎬 Ending Debug</div>
    <button onclick="if(window.triggerRampageEnding) window.triggerRampageEnding();" style="
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(248, 113, 113, 0.5);
      color: #fca5a5;
      padding: 5px 14px;
      font-size: 10px;
      font-family: 'Cinzel', serif;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.5px;
    ">⚔️ Rampage</button>
    <button onclick="if(window.triggerHeroEnding) window.triggerHeroEnding();" style="
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(74, 222, 128, 0.5);
      color: #86efac;
      padding: 5px 14px;
      font-size: 10px;
      font-family: 'Cinzel', serif;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.5px;
    ">👑 Hero</button>
    <button onclick="if(window.triggerBetrayalEnding) window.triggerBetrayalEnding();" style="
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(192, 132, 252, 0.5);
      color: #d8b4fe;
      padding: 5px 14px;
      font-size: 10px;
      font-family: 'Cinzel', serif;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.5px;
    ">🗡️ Betrayal</button>
    <button onclick="if(window.triggerShatteredMind) window.triggerShatteredMind();" style="
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(125, 211, 252, 0.5);
      color: #bae6fd;
      padding: 5px 14px;
      font-size: 10px;
      font-family: 'Cinzel', serif;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.5px;
    ">🧠 Shattered Mind</button>
  </div>

  <script>
    // Developer tool activation: ?debug=true or Ctrl+Shift+E or window.showEndingDebug()
    window.showEndingDebug = function(force) {
      var p = document.getElementById('ending-debug-panel');
      if (!p) return;
      var show = (force !== undefined) ? !!force : (p.style.display === 'none');
      p.style.display = show ? 'flex' : 'none';
    };
    if (new URLSearchParams(window.location.search).has('debug') || localStorage.getItem('db_debug_mode') === 'true') {
      window.showEndingDebug(true);
    }
    window.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')) {
        window.showEndingDebug();
      }
    });
  </script>

  <!-- Modular Application Bootstrap -->
  <script type="module" src="./js/main.js?v=2.4"></script>
</body>
</html>
