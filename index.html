// ── 1. Normalized Input State ─────────────────────────────────────────
const INPUT_KEYS = {};
window.addEventListener('keydown', e => {
  SoundManager.init();
  const k = e.key;
  const c = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) {
    e.preventDefault();
  }
  INPUT_KEYS[k] = true;
  INPUT_KEYS[c] = true;
  if (k.length === 1) {
    INPUT_KEYS[k.toLowerCase()] = true;
    INPUT_KEYS[k.toUpperCase()] = true;
  }

  // State-gated key handlers
  if (STATE === 'playing') {
    if (ACTIVE_WEAPON_REPLACE_MODAL) {
      if (k === '1') { replaceWeaponSlot(0, ACTIVE_WEAPON_REPLACE_MODAL.newWeapon); return; }
      if (k === '2') { replaceWeaponSlot(1, ACTIVE_WEAPON_REPLACE_MODAL.newWeapon); return; }
      if (k === '3') { replaceWeaponSlot(2, ACTIVE_WEAPON_REPLACE_MODAL.newWeapon); return; }
      if (k === 'Escape') { discardReplacementWeapon(); return; }
      return;
    }
    if (typeof ACTIVE_MEMORY_ECHO !== 'undefined' && ACTIVE_MEMORY_ECHO) {
      if (k === '1') { ACTIVE_MEMORY_ECHO.choiceA.effect(); ACTIVE_MEMORY_ECHO = null; SoundManager.snd('talent_unlock'); return; }
      if (k === '2') { ACTIVE_MEMORY_ECHO.choiceB.effect(); ACTIVE_MEMORY_ECHO = null; SoundManager.snd('talent_unlock'); return; }
      if (k === 'Escape') { ACTIVE_MEMORY_ECHO = null; return; }
      return;
    }
    if (typeof ACTIVE_LORE_MODAL !== 'undefined' && ACTIVE_LORE_MODAL) {
      if (k === 'Escape' || k === 'Enter' || k === ' ') { ACTIVE_LORE_MODAL = null; return; }
      return;
    }

    if (k === ' ') { doAttack(); return; }
    if (k === 'Shift') { fireBowQuick(); return; }
    if (k.toLowerCase() === 'q') { triggerWeaponAbility(); return; }
    if (k === '1') { switchWeaponSlot(0); return; }
    if (k === '2') { switchWeaponSlot(1); return; }
    if (k === '3') { switchWeaponSlot(2); return; }
    if (k.toLowerCase() === 'm') { MINIMAP_VISIBLE = !MINIMAP_VISIBLE; return; }
    if (k.toLowerCase() === 'c') { openCodex(); return; }
    if (k.toLowerCase() === 'u') { openSanctum(); return; }
    if (k === 'Escape' || k.toLowerCase() === 'p') { pauseGame(); return; }
  } else if (STATE === 'pause') {
    if (k === 'Escape' || k.toLowerCase() === 'p' || k === 'Enter') { resumeGame(); return; }
  } else if (STATE === 'title') {
    if (k === 'Enter') { startGame(); return; }
    if (k.toLowerCase() === 'r') { const sv = loadSave(); if (sv) applyLoadedSave(sv); return; }
    if (k.toLowerCase() === 'c') { openCodex(); return; }
    if (k.toLowerCase() === 'u' || k.toLowerCase() === 's') { openSanctum(); return; }
  } else if (STATE === 'death_normal' || STATE === 'death_sanity' || STATE === 'endcard') {
    if (k === 'Enter' || k.toLowerCase() === 'r') { retryGame(); return; }
    if (k === 'Escape' || k.toLowerCase() === 't') { quitToMainMenu(); return; }
  } else if (STATE === 'cinematic') {
    if (k === 'Enter' || k === ' ') { ciAdvance(); return; }
  } else if (STATE === 'titlecinematic') {
    if (k === 'Enter' || k === ' ' || k === 'Escape') { TC_skip(); return; }
  } else if (STATE === 'sanctum' || STATE === 'codex' || STATE === 'settings' || STATE === 'achievements') {
    if (k === 'Escape') { STATE = 'title'; return; }
  }
});

window.addEventListener('keyup', e => {
  delete INPUT_KEYS[e.key];
  delete INPUT_KEYS[e.code];
  if (e.key.length === 1) {
    delete INPUT_KEYS[e.key.toLowerCase()];
    delete INPUT_KEYS[e.key.toUpperCase()];
  }
});

// ── 2. 3-Slot Weapon Inventory & Model ────────────────────────────────
const WEAPON_TYPES = {
  sword:  { id: 'sword',  name: 'Steel Sword',       type: 'melee',  damage: 2, range: 1.5,  cooldown: 0.32, icon: '⚔️', col: '#facc15', trailCol: '#fde68a' },
  bow:    { id: 'bow',    name: "Hunter's Bow",      type: 'ranged', damage: 2, range: 8.0,  cooldown: 0.42, icon: '🏹', col: '#34d399', trailCol: '#6ee7b7' },
  axe:    { id: 'axe',    name: "Executioner's Axe", type: 'melee',  damage: 4, range: 1.8,  cooldown: 0.60, icon: '🪓', col: '#f97316', trailCol: '#ea580c' },
  dagger: { id: 'dagger', name: 'Shadow Dagger',     type: 'melee',  damage: 1, range: 1.2,  cooldown: 0.15, icon: '🗡️', col: '#c084fc', trailCol: '#a855f7' },
  spear:  { id: 'spear',  name: 'Obsidian Spear',    type: 'melee',  damage: 3, range: 2.5,  cooldown: 0.38, icon: '🔱', col: '#38bdf8', trailCol: '#0284c7' }
};

function createWeapon(id, rarityName = 'Common', affixes = [], level = 1) {
  const base = WEAPON_TYPES[id] || WEAPON_TYPES.sword;
  const rar = RARITIES.find(r => r.name.toLowerCase() === (rarityName || 'common').toLowerCase()) || RARITIES[0];
  const dmgMul = rar.name === 'Legendary' ? 2.2 : rar.name === 'Epic' ? 1.6 : rar.name === 'Rare' ? 1.25 : 1.0;
  return {
    id: base.id,
    name: base.name,
    type: base.type,
    damage: Math.round(base.damage * dmgMul * (1 + (level - 1) * 0.08)),
    range: base.range,
    cooldown: base.cooldown,
    rarity: rar,
    affixes: affixes,
    level: level,
    icon: base.icon,
    col: base.col,
    trailCol: base.trailCol
  };
}

let weaponSlots = [
  createWeapon('sword', 'Common'),
  null,
  null
];
let activeWeaponSlot = 0;
let ACTIVE_WEAPON_REPLACE_MODAL = null;

function getActiveWeapon() {
  return weaponSlots[activeWeaponSlot] || weaponSlots[0] || createWeapon('sword', 'Common');
}

function switchWeaponSlot(idx) {
  if (idx < 0 || idx >= 3) return;
  if (!weaponSlots[idx]) return;
  activeWeaponSlot = idx;
  const w = weaponSlots[idx];
  P.wep = w.id;
  P.wepRarity = w.rarity;
  SoundManager.snd('item_pickup');
  spawnP(P.x, P.y, 8, { col: w.col, spd: 1.2, life: 0.4, r: 2.5, star: true });
  showFloatingText(w.name + ' [' + w.rarity.name + ']', P.x, P.y - 0.7, w.rarity.col, 13, true);
}

function pickupWeapon(droppedWep, itemRef) {
  const emptyIdx = weaponSlots.findIndex(w => w === null);
  if (emptyIdx !== -1) {
    weaponSlots[emptyIdx] = droppedWep;
    switchWeaponSlot(emptyIdx);
    GAME_MSG = droppedWep.name + ' [' + droppedWep.rarity.name + '] equipped!';
    GAME_MSG_TIMER = 3.5;
    SoundManager.snd('item_pickup');
  } else {
    // Inventory full: open interactive weapon replacement UI!
    ACTIVE_WEAPON_REPLACE_MODAL = {
      newWeapon: droppedWep,
      itemRef: itemRef
    };
    SoundManager.snd('talent_unlock');
  }
}

function replaceWeaponSlot(slotIdx, newWep) {
  if (slotIdx >= 0 && slotIdx < 3 && newWep) {
    const oldWep = weaponSlots[slotIdx];
    weaponSlots[slotIdx] = newWep;
    switchWeaponSlot(slotIdx);
    ACTIVE_WEAPON_REPLACE_MODAL = null;
    GAME_MSG = 'Replaced ' + (oldWep ? oldWep.name : 'Slot') + ' with ' + newWep.name;
    GAME_MSG_TIMER = 3.0;
    SoundManager.snd('item_pickup');
  }
}

function discardReplacementWeapon() {
  ACTIVE_WEAPON_REPLACE_MODAL = null;
  GAME_MSG = 'Weapon discarded.';
  GAME_MSG_TIMER = 2.0;
}

// ── 3. Distinct Weapon Attacks & Feel ─────────────────────────────────
function doAttack() {
  const w = getActiveWeapon();
  if (P.acd > 0 || P.dead) return;
  P.acd = w.cooldown;
  P.aanim = w.cooldown;
  AFL = 0.07;
  const ang = Math.atan2(P.fy, P.fx);
  const dmg = Math.round(w.damage * (P.dmgBoost || 1));
  const currentSwingId = ++SWING_COUNTER;
  const attackSource = { isPlayer: true, x: P.x, y: P.y, attackId: currentSwingId, type: 'melee' };

  if (w.type === 'ranged' || w.id === 'bow') {
    shk(3);
    spawnProjectile(P.x, P.y, Math.cos(ang) * 9.5, Math.sin(ang) * 9.5, dmg);
    spawnP(P.x, P.y, 6, { col: w.col, spd: 1.2, life: 0.25, r: 2.0, angle: ang, spread: 0.4 });
    SoundManager.snd('bow_shoot');
    return;
  }

  // Melee attack variants
  shk(w.id === 'axe' ? 14 : w.id === 'spear' ? 6 : w.id === 'dagger' ? 2 : 4);
  const tx = P.x + P.fx * w.range * 0.8;
  const ty = P.y + P.fy * w.range * 0.8;
  spawnSlashTrail(P.x, P.y, ang, w.id);

  if (w.id === 'axe') {
    spawnP(tx, ty, 20, { col: '#f97316', spd: 2.2, life: 0.45, r: 4.5, angle: ang, spread: 1.6 });
    spawnP(tx, ty, 8, { col: '#fde68a', spd: 1.2, life: 0.5, r: 2.5, star: true });
    spawnRing(tx, ty, '#ea580c');
  } else if (w.id === 'dagger') {
    spawnP(tx, ty, 8, { col: w.trailCol, spd: 1.8, life: 0.18, r: 2.2, angle: ang, spread: 0.5 });
  } else if (w.id === 'spear') {
    spawnP(tx, ty, 12, { col: w.trailCol, spd: 2.2, life: 0.3, r: 2.4, angle: ang, spread: 0.2 });
  } else {
    spawnP(tx, ty, 10, { col: w.trailCol, spd: 1.4, life: 0.3, r: 2.8, angle: ang, spread: 1.2 });
  }

  let hitAny = false;

  // Boss hit via dealDamage
  if (BOSS && BOSS.alive && isBossFloor()) {
    const dist = Math.hypot(P.x - BOSS.x, P.y - BOSS.y);
    if (dist < w.range + 0.8) {
      if (dealDamage(attackSource, BOSS, dmg, 'melee')) {
        hitAny = true;
      }
    }
  }

  // Enemy hits via dealDamage (strictly per-swing tracked)
  for (let j = ENE.length - 1; j >= 0; j--) {
    const e = ENE[j]; if (!e.alive) continue;
    const dist = Math.hypot(P.x - e.x, P.y - e.y);
    let hit = false;
    if (w.id === 'spear') {
      const dot = (e.x - P.x) * P.fx + (e.y - P.y) * P.fy;
      const cross = Math.abs((e.x - P.x) * P.fy - (e.y - P.y) * P.fx);
      if (dot > 0 && dot < w.range + 0.5 && cross < 0.75) hit = true;
    } else {
      if (dist < w.range) {
        const eAng = Math.atan2(e.y - P.y, e.x - P.x);
        const diffAng = Math.abs(((eAng - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        if (diffAng < (w.id === 'axe' ? 1.6 : w.id === 'dagger' ? 0.7 : 1.2)) hit = true;
      }
    }

    if (hit) {
      const actualDmg = w.id === 'dagger' ? Math.max(1, Math.round(dmg * 0.65)) : dmg;
      if (dealDamage(attackSource, e, actualDmg, w.id === 'axe' ? 'heavy' : (w.id === 'spear' ? 'pierce' : 'melee'))) {
        hitAny = true;
      }
    }
  }

  if (hitAny) {
    if (typeof triggerHitStop === 'function') triggerHitStop(w.id === 'axe' ? 0.09 : 0.04);
    spawnRing(tx, ty, w.col);
    if (typeof FX !== 'undefined' && FX.spawnImpactBurst) FX.spawnImpactBurst(tx, ty, w.col, 1.5);
  }
}

function fireBowQuick() {
  const bowSlot = weaponSlots.findIndex(w => w && w.id === 'bow');
  if (bowSlot !== -1 && activeWeaponSlot !== bowSlot) {
    switchWeaponSlot(bowSlot);
  }
  if (getActiveWeapon().id === 'bow') {
    doAttack();
  }
}

// ── 4. Velocity Steering AI for Enemies ───────────────────────────────
function tickENE(dt) {
  const diff = getDiff(LV);
  ENE.forEach((e, ei) => {
    if (!e.alive) { e.dAnim = Math.max(0, (e.dAnim || 0.4) - dt); return; }
    e.ph = (e.ph || 0) + 0.04 * dt * TARGET_FPS;
    if (e.atkC > 0) e.atkC = Math.max(0, e.atkC - dt);
    if (e.telegraphTimer > 0) e.telegraphTimer = Math.max(0, e.telegraphTimer - dt);
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);

    const dx = P.x - e.x, dy = P.y - e.y, dist = Math.hypot(dx, dy) || 1;
    const isWraith = e.type === 'wraith';
    const isDemon = e.type === 'demon';
    const isGhoul = e.type === 'ghoul';
    const isElite = e.isElite || e.type === 'elite';

    const sightR = isWraith ? 10 : isDemon ? 9 : isElite ? 9 : 7.5;
    const maxSpd = diff.espd * (isWraith ? 1.4 : isGhoul ? 1.25 : isDemon ? 0.95 : isElite ? 0.85 : 1.0);
    const accel = 12.0;

    // AI state machine
    if (e.hitFlash > 0.08) {
      e.aiState = 'HURT';
    } else if (dist < sightR && !P.dead) {
      if (dist < (isDemon ? 5.5 : 0.9) && e.atkC <= 0) {
        e.aiState = 'ATTACK';
      } else {
        e.aiState = 'CHASE';
      }
    } else if (e.alertT > 0) {
      e.aiState = 'ALERT';
      e.alertT -= dt * 0.4;
    } else {
      e.aiState = (e.vx || 0) * (e.vx || 0) + (e.vy || 0) * (e.vy || 0) > 0.05 ? 'PATROL' : 'IDLE';
    }

    let desiredVx = 0, desiredVy = 0;

    if (e.aiState === 'CHASE') {
      if (isDemon) {
        if (dist < 3.5) {
          desiredVx = -(dx / dist) * maxSpd;
          desiredVy = -(dy / dist) * maxSpd;
        } else if (dist > 5.5) {
          desiredVx = (dx / dist) * maxSpd;
          desiredVy = (dy / dist) * maxSpd;
        } else {
          desiredVx = -(dy / dist) * maxSpd * 0.6;
          desiredVy = (dx / dist) * maxSpd * 0.6;
        }
      } else {
        desiredVx = (dx / dist) * maxSpd;
        desiredVy = (dy / dist) * maxSpd;
      }
    } else if (e.aiState === 'ATTACK') {
      if (isDemon) {
        if (!e.telegraphing) {
          e.telegraphing = true;
          e.telegraphTimer = 0.6;
        } else if (e.telegraphTimer <= 0) {
          e.telegraphing = false;
          e.atkC = 2.2;
          const ang = Math.atan2(dy, dx);
          PROJECTILES.push({
            x: e.x, y: e.y,
            vx: Math.cos(ang) * 6.5, vy: Math.sin(ang) * 6.5,
            life: 0, maxLife: 3.5, damage: 1,
            fromPlayer: false, hit: false, isBoss: false, col: '#f97316'
          });
          SoundManager.snd('shockwave');
          spawnP(e.x, e.y, 8, { col: '#f97316', spd: 1.0, life: 0.4, r: 2.5 });
        }
      } else {
        if (!e.telegraphing) {
          e.telegraphing = true;
          e.telegraphTimer = 0.35;
        } else if (e.telegraphTimer <= 0) {
          e.telegraphing = false;
          e.atkC = isGhoul ? 0.8 : 1.2;
          if (dist < 0.95 && !P.shieldActive && P.dcd <= 0 && !P.dead) {
            playerTakeDamage(isElite ? 2 : 1);
            showFloatingText('-' + (isElite ? 2 : 1) + ' ❤', P.x, P.y - 0.5, '#ef4444', 14);
          }
        }
      }
    } else if (e.aiState === 'PATROL') {
      desiredVx = Math.cos(e.ph * 0.5) * maxSpd * 0.35;
      desiredVy = Math.sin(e.ph * 0.5) * maxSpd * 0.35;
    } else if (e.aiState === 'HURT') {
      desiredVx = 0; desiredVy = 0;
    }

    // Velocity-based steering
    e.vx = (e.vx || 0) + (desiredVx - (e.vx || 0)) * Math.min(1, dt * accel);
    e.vy = (e.vy || 0) + (desiredVy - (e.vy || 0)) * Math.min(1, dt * accel);

    // Natural separation forces
    ENE.forEach((o, oi) => {
      if (oi === ei || !o.alive) return;
      const ox = e.x - o.x, oy = e.y - o.y;
      const sd = Math.hypot(ox, oy);
      if (sd < 0.95 && sd > 0.001) {
        const push = (0.95 - sd) / 0.95 * 3.5;
        e.vx += (ox / sd) * push * dt;
        e.vy += (oy / sd) * push * dt;
      }
    });

    e.vx *= Math.pow(0.88, dt * TARGET_FPS);
    e.vy *= Math.pow(0.88, dt * TARGET_FPS);

    // Wall slide movement
    const stepX = e.vx * dt;
    const stepY = e.vy * dt;
    if (!solidAt(e.x + stepX, e.y)) e.x += stepX; else e.vx = 0;
    if (!solidAt(e.x, e.y + stepY)) e.y += stepY; else e.vy = 0;

    // Wraith phase teleport on hit
    if (isWraith && e.hitFlash > 0.18 && Math.random() < 0.35 && (!e.lastTeleport || e.ph - e.lastTeleport > 3.0)) {
      e.lastTeleport = e.ph;
      const ang = Math.random() * 6.28;
      const tx = P.x + Math.cos(ang) * 2.5;
      const ty = P.y + Math.sin(ang) * 2.5;
      if (!solidAt(tx, ty)) {
        spawnP(e.x, e.y, 10, { col: '#a855f7', spd: 1.2, life: 0.5, r: 2.5 });
        e.x = tx; e.y = ty;
        spawnP(e.x, e.y, 10, { col: '#c084fc', spd: 1.2, life: 0.5, r: 2.5 });
      }
    }

    AnimSystem.tickEnemy(e, dt);
  });
}

// ── 5. Player Tick with Normalized Input ──────────────────────────────
function tickPlayer(dt) {
  if (P.dead) return;

  // Normalized movement
  let dx = 0, dy = 0;
  if (INPUT_KEYS['ArrowUp']    || INPUT_KEYS['w'] || INPUT_KEYS['W'] || INPUT_KEYS['KeyW'] || TOUCH_DIR.y < -0.15) dy = -1;
  if (INPUT_KEYS['ArrowDown']  || INPUT_KEYS['s'] || INPUT_KEYS['S'] || INPUT_KEYS['KeyS'] || TOUCH_DIR.y >  0.15) dy =  1;
  if (INPUT_KEYS['ArrowLeft']  || INPUT_KEYS['a'] || INPUT_KEYS['A'] || INPUT_KEYS['KeyA'] || TOUCH_DIR.x < -0.15) dx = -1;
  if (INPUT_KEYS['ArrowRight'] || INPUT_KEYS['d'] || INPUT_KEYS['D'] || INPUT_KEYS['KeyD'] || TOUCH_DIR.x >  0.15) dx =  1;

  if (Math.abs(TOUCH_DIR.x) > 0.15 || Math.abs(TOUCH_DIR.y) > 0.15) {
    const L = Math.hypot(TOUCH_DIR.x, TOUCH_DIR.y) || 1;
    dx = TOUCH_DIR.x / L; dy = TOUCH_DIR.y / L;
  }

  if (dx || dy) {
    const L = Math.hypot(dx, dy);
    dx = dx / L * P.spd * dt; dy = dy / L * P.spd * dt;
    if (Math.abs(dx) > Math.abs(dy)) { P.fx = dx > 0 ? 1 : -1; P.fy = 0; }
    else { P.fx = 0; P.fy = dy > 0 ? 1 : -1; }
    if (!solidAt(P.x + dx, P.y)) P.x += dx;
    if (!solidAt(P.x, P.y + dy)) P.y += dy;
    if (F % 9 === 0) spawnP(P.x, P.y, 1, { col: '#c4a882', spd: .25, life: 0.22, r: 1.8, gv: .04, spread: 3.14 });
  }

  P.vx = dx / dt; P.vy = dy / dt;

  if (P.acd > 0) P.acd = Math.max(0, P.acd - dt);
  if (P.aanim > 0) P.aanim = Math.max(0, P.aanim - dt);
  if (P.dcd > 0) P.dcd = Math.max(0, P.dcd - dt);
  if (P.icd > 0) P.icd = Math.max(0, P.icd - dt);
  if (P.hitFlash > 0) P.hitFlash = Math.max(0, P.hitFlash - dt);

  // Ghost HP smoothing
  if (P.ghostHp > P.hp) {
    P.ghostHp = Math.max(P.hp, P.ghostHp - dt * 2.5);
  }

  if (P.shieldActive) {
    P.shieldTimer = Math.max(0, P.shieldTimer - dt);
    if (P.shieldTimer <= 0) P.shieldActive = false;
  }

  LEVEL_TIMER += dt;
  const secs = Math.floor(LEVEL_TIMER);
  LEVEL_TIME_STR = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');

  SoundManager.tickHeartbeat(dt);
  checkExit();
  collectItems();
  collectAllies();
  AnimSystem.tickPlayer(dt);
}

// ── 6. Guaranteed Sequential Floor Transitions ────────────────────────
levelTransitionActive = false;

function checkExit() {
  if (levelTransitionActive || PORTAL_USED || P.dead || (typeof WARP_ACTIVE !== 'undefined' && WARP_ACTIVE)) return;
  const tx = Math.round(P.x), ty = Math.round(P.y);
  if (!MAP[ty] || MAP[ty][tx] !== 2) return;
  if (isBossFloor() && !BOSS_DEAD) return;

  levelTransitionActive = true;
  PORTAL_USED = true;
  SoundManager.snd('portal_enter');
  if (!LEVEL_TOOK_DAMAGE) unlockAchievement('untouchable');
  if (LEVEL_TIMER < 90) unlockAchievement('speed_runner');
  saveGame();

  if (LV >= MAX_LV) {
    decideEnding();
  } else {
    if (typeof startCosmicHyperWarp === 'function') {
      startCosmicHyperWarp(LV + 1);
    } else {
      LV++;
      loadLevel();
      levelTransitionActive = false;
    }
  }
}

// Hook into tickCosmicHyperWarp to release levelTransitionActive when warp ends
const _orig_tickCosmicHyperWarp = (typeof tickCosmicHyperWarp === 'function') ? tickCosmicHyperWarp : null;
tickCosmicHyperWarp = function(dt) {
  if (!WARP_ACTIVE) return;
  WARP_TIMER += dt;

  if (WARP_TIMER >= 0.95 && LV !== WARP_NEXT_LV) {
    LV = WARP_NEXT_LV;
    loadLevel();
    AFL = 0.45;
    shk(8);
  }

  if (WARP_TIMER >= WARP_DUR) {
    WARP_ACTIVE = false;
    PORTAL_USED = false;
    levelTransitionActive = false;
    if (LV === 10) {
      startBossIntroCinematic();
    } else {
      STATE = 'playing';
      GAME_MSG = 'Level ' + LV + ' — ' + THEMES[Math.min(LV - 1, THEMES.length - 1)].name + ' — Find the portal.';
      GAME_MSG_TIMER = 4.5;
    }
  }
};

function drawInteractionPrompt(px, py, label) {
  CX.save();
  const bob = Math.sin(F * 0.15) * 2;
  const y = py + bob;
  CX.font = 'bold 9px Cinzel,sans-serif';
  const text = `[ E ] ${label || 'INTERACT'}`;
  const tw = CX.measureText(text).width;
  CX.fillStyle = 'rgba(15,20,35,0.88)';
  CX.strokeStyle = 'rgba(253,230,138,0.75)';
  CX.lineWidth = 1.2;
  roundRect(CX, px - tw / 2 - 6, y - 9, tw + 12, 17, 4);
  CX.fill();
  CX.stroke();
  CX.fillStyle = '#fde68a';
  CX.textAlign = 'center';
  CX.textBaseline = 'middle';
  CX.fillText(text, px, y - 0.5);
  CX.restore();
}

function collectItems() {
  ITEMS.forEach(it => {
    if (it.taken) return;
    if (Math.abs(P.x - it.x) < 0.75 && Math.abs(P.y - it.y) < 0.75) {
      if (it.kind === 'weapon') {
        it.taken = true;
        const newWep = createWeapon(it.sub || 'sword', it.rarity ? it.rarity.name : 'Common', it.affixes || [], LV);
        pickupWeapon(newWep, it);
      } else if (it.kind === 'health') {
        it.taken = true;
        P.hp = Math.min(P.maxHp, P.hp + 2);
        P.ghostHp = P.hp;
        GAME_MSG = '❤️ Health restored! +2 HP'; GAME_MSG_TIMER = 3.0;
        spawnP(it.x, it.y, 10, { col: '#ef4444', spd: 1.0, life: 0.6, r: 3 });
        SoundManager.snd('item_pickup');
      } else if (it.kind === 'sanity') {
        it.taken = true;
        P.san = Math.min(100, P.san + 30);
        GAME_MSG = '🧠 Sanity restored! +30%'; GAME_MSG_TIMER = 3.0;
        spawnP(it.x, it.y, 10, { col: '#818cf8', spd: 1.0, life: 0.6, r: 3 });
        SoundManager.snd('item_pickup');
      } else if (it.kind === 'shield') {
        it.taken = true;
        P.shieldActive = true; P.shieldTimer = 10;
        GAME_MSG = '🛡️ Shield active! 10s immunity!'; GAME_MSG_TIMER = 3.5;
        SoundManager.snd('shield_activate');
        spawnP(it.x, it.y, 15, { col: '#67e8f9', spd: 1.5, life: 0.75, r: 3, star: true });
      } else if (it.kind === 'story_echo') {
        it.taken = true;
        if (typeof triggerStoryEcho === 'function') triggerStoryEcho(it.echoData);
      } else if (it.kind === 'lore_scroll') {
        it.taken = true;
        if (typeof openLoreModal === 'function') openLoreModal(it.scrollData);
      }
    }
  });
}

// ── 8. Death Sequences & Dedicated UI ──────────────────────────────────
function playerTakeDamage(amount) {
  if (P.dead || P.dcd > 0 || P.shieldActive) return;
  P.hp = Math.max(0, P.hp - amount);
  P.dcd = 1.0; P.icd = 0.3; P.hitFlash = 0.25;
  DFL = 0.2; shk(8);
  spawnP(P.x, P.y, 8, { col: '#ef4444', spd: 1.2, life: 0.35, r: 3 });
  LEVEL_TOOK_DAMAGE = true;
  SoundManager.snd('player_hurt');

  if (P.hp <= 0 && !P.dead) {
    P.dead = true; P.hp = 0;
    startNormalDeathSequence();
  }
}

function tickSanity(dt) {
  if (P.dead) return;
  P.san = Math.max(0, P.san - getDiff(LV).sdrain * dt);
  if (P.san <= 0 && !P.dead) {
    P.dead = true;
    startSanityDeathSequence();
  }
}

function startNormalDeathSequence() {
  STATE = 'death_normal';
  SoundManager.snd('player_hurt');
  shk(14);
}

function startSanityDeathSequence() {
  STATE = 'death_sanity';
  SoundManager.snd('boss_roar');
  shk(18);
}

  CX.lineWidth = 1.8;
  roundRect(CX, panX, panY, panW, panH, 12);
  CX.fill(); CX.stroke();

  CX.fillStyle = '#fde68a';
  CX.font = 'bold 15px Cinzel, serif';
  CX.textAlign = 'center'; CX.textBaseline = 'top';
  CX.fillText('⚔️ INVENTORY FULL — CHOOSE REPLACEMENT', LW / 2, panY + 16);

  CX.fillStyle = '#94a3b8';
  CX.font = '11px Cinzel, serif';
  CX.fillText('Select an existing slot to replace, or discard the newly found weapon:', LW / 2, panY + 40);

  const nw = ACTIVE_WEAPON_REPLACE_MODAL.newWeapon;
  const nCardX = panX + 30, nCardY = panY + 64, nCardW = panW - 60, nCardH = 54;
  CX.fillStyle = 'rgba(201, 168, 76, 0.12)';
  CX.strokeStyle = nw.rarity.col || '#fde68a';
  CX.lineWidth = 1.5;
  roundRect(CX, nCardX, nCardY, nCardW, nCardH, 8);
  CX.fill(); CX.stroke();

  CX.fillStyle = nw.rarity.col || '#fde68a';
  CX.font = 'bold 12px Cinzel, serif';
  CX.textAlign = 'left'; CX.textBaseline = 'middle';
  CX.fillText('NEW: ' + nw.icon + ' ' + nw.name + ' [' + nw.rarity.name + ']', nCardX + 16, nCardY + 18);
  CX.fillStyle = '#e2e8f0';
  CX.font = '11px Crimson Text, serif';
  CX.fillText('Damage: ' + nw.damage + '  ·  Type: ' + nw.type + '  ·  Range: ' + nw.range, nCardX + 16, nCardY + 36);

  const slotW = (panW - 70) / 3;
  for (let i = 0; i < 3; i++) {
    const sw = weaponSlots[i];
    const sX = panX + 25 + i * (slotW + 10);
    const sY = panY + 135;
    const sH = 140;

    CX.fillStyle = 'rgba(15, 23, 42, 0.9)';
    CX.strokeStyle = (i === activeWeaponSlot) ? '#fde68a' : 'rgba(71, 85, 105, 0.5)';
    CX.lineWidth = (i === activeWeaponSlot) ? 2 : 1;
    roundRect(CX, sX, sY, slotW, sH, 8);
    CX.fill(); CX.stroke();

    CX.fillStyle = (i === activeWeaponSlot) ? '#fde68a' : '#94a3b8';
    CX.font = 'bold 11px Cinzel, serif';
    CX.textAlign = 'center'; CX.textBaseline = 'top';
    CX.fillText('SLOT ' + (i + 1), sX + slotW / 2, sY + 10);

    if (sw) {
      CX.fillStyle = sw.rarity.col || '#ffffff';
      CX.font = '22px serif';
      CX.fillText(sw.icon, sX + slotW / 2, sY + 30);
      CX.font = 'bold 10px Cinzel, serif';
      CX.fillText(sw.name, sX + slotW / 2, sY + 60);
      CX.fillStyle = '#64748b';
      CX.font = '9px Cinzel, serif';
      CX.fillText(sw.rarity.name + ' · Dmg: ' + sw.damage, sX + slotW / 2, sY + 76);
    } else {
      CX.fillStyle = '#475569';
      CX.font = 'italic 11px Crimson Text, serif';
      CX.fillText('[ EMPTY ]', sX + slotW / 2, sY + 50);
    }

    const btnY = sY + 98;
    CX.fillStyle = 'rgba(201, 168, 76, 0.2)';
    CX.strokeStyle = 'rgba(201, 168, 76, 0.6)';
    CX.lineWidth = 1;
    roundRect(CX, sX + 8, btnY, slotW - 16, 28, 4);
    CX.fill(); CX.stroke();
    CX.fillStyle = '#fde68a';
    CX.font = 'bold 10px Cinzel, serif';
    CX.textBaseline = 'middle';
    CX.fillText('[' + (i + 1) + '] Replace', sX + slotW / 2, btnY + 14);
  }

  const discX = panX + panW / 2 - 80, discY = panY + panH - 46, discW = 160, discH = 32;
  CX.fillStyle = 'rgba(239, 68, 68, 0.2)';
  CX.strokeStyle = 'rgba(239, 68, 68, 0.6)';
  CX.lineWidth = 1.2;
  roundRect(CX, discX, discY, discW, discH, 6);
  CX.fill(); CX.stroke();
  CX.fillStyle = '#f87171';
  CX.font = 'bold 11px Cinzel, serif';
  CX.textAlign = 'center'; CX.textBaseline = 'middle';
  CX.fillText('✕ Discard New Weapon', discX + discW / 2, discY + discH / 2);

  CX.restore();
}

function handleWeaponReplaceClick(mx, my) {
  if (!ACTIVE_WEAPON_REPLACE_MODAL) return false;
  const panW = 520, panH = 360;
  const panX = LW / 2 - panW / 2, panY = LH / 2 - panH / 2;

  const slotW = (panW - 70) / 3;
  for (let i = 0; i < 3; i++) {
    const sX = panX + 25 + i * (slotW + 10);
    const sY = panY + 135;
    if (mx >= sX && mx <= sX + slotW && my >= sY && my <= sY + 140) {
      replaceWeaponSlot(i, ACTIVE_WEAPON_REPLACE_MODAL.newWeapon);
      return true;
    }
  }

  const discX = panX + panW / 2 - 80, discY = panY + panH - 46, discW = 160, discH = 32;
  if (mx >= discX && mx <= discX + discW && my >= discY && my <= discY + discH) {
    discardReplacementWeapon();
    return true;
  }

  return true;
}

// ── 10. Centralized Master Click Dispatcher ───────────────────────────
CV.addEventListener('pointerdown', e => {
  SoundManager.init();
  const { mx, my } = _cssToGame(e.clientX, e.clientY);

  // 1. Weapon Replace Modal
  if (ACTIVE_WEAPON_REPLACE_MODAL) {
    if (handleWeaponReplaceClick(mx, my)) return;
  }
  // 2. Memory Echo Modal
  if (typeof ACTIVE_MEMORY_ECHO !== 'undefined' && ACTIVE_MEMORY_ECHO) {
    if (typeof handleMemoryEchoClick === 'function' && handleMemoryEchoClick(mx, my)) return;
  }
  // 3. Lore Scroll Modal
  if (typeof ACTIVE_LORE_MODAL !== 'undefined' && ACTIVE_LORE_MODAL) {
    ACTIVE_LORE_MODAL = null;
    return;
  }

  // 4. State Title
  if (STATE === 'title') {
    if (mx > LW / 2 - 120 && mx < LW / 2 + 120 && my > 240 && my < 292) { startGame(); return; }
    if (mx > LW / 2 - 110 && mx < LW / 2 + 110 && my > 294 && my < 346) { openTrainingDungeon(); return; }
    if (mx > LW / 2 - 110 && mx < LW / 2 + 110 && my > 346 && my < 398) { openSettings(); return; }
    if (mx > LW / 2 - 110 && mx < LW / 2 + 110 && my > 398 && my < 450) { openAchievements(); return; }
    if (mx > LW / 2 - 110 && mx < LW / 2 + 110 && my > 450 && my < 502) { openSanctum(); return; }
    if (mx > LW / 2 - 110 && mx < LW / 2 + 110 && my > 502 && my < 554) { openCodex(); return; }
    return;
  }

  // 5. State Playing
  if (STATE === 'playing') {
    // Check HUD weapon slots (clickable slots 1, 2, 3 with glow)
    const hudSlotStartX = 200;
    const hudSlotY = LH - 44;
    const hudSlotW = 38;
    const hudSlotGap = 6;
    for (let i = 0; i < 3; i++) {
      const sx = hudSlotStartX + i * (hudSlotW + hudSlotGap);
      if (mx >= sx && mx <= sx + hudSlotW && my >= hudSlotY && my <= hudSlotY + 36) {
        switchWeaponSlot(i);
        return;
      }
    }

    // Minimap toggle touch
    if (mx >= LW - 134 && mx <= LW - 14 && my >= 70 && my <= 154) {
      MINIMAP_VISIBLE = !MINIMAP_VISIBLE;
      return;
    }

    // Pause button in HUD (top right)
    if (mx >= LW - 54 && my <= 54) {
      pauseGame(); return;
    }

    // Ability badge
    if (mx >= LW / 2 - 60 && mx <= LW / 2 + 60 && my >= LH - 135 && my <= LH - 95) {
      triggerWeaponAbility(); return;
    }

    // World attack
    doAttack();
    return;
  }

  // 6. State Pause
  if (STATE === 'pause') {
    if (typeof _handlePauseMenuTouch === 'function' && _handlePauseMenuTouch(mx, my)) return;
    resumeGame();
    return;
  }

  // 7. Death Screens (Normal & Sanity)
  if (STATE === 'death_normal' || STATE === 'death_sanity' || STATE === 'endcard') {
    const btnW = 160, btnH = 46;
    const btn1X = LW / 2 - btnW - 15;
    const btn2X = LW / 2 + 15;
    const btnY = 320;
    if (mx >= btn1X && mx <= btn1X + btnW && my >= btnY && my <= btnY + btnH) {
      retryGame(); return;
    }
    if (mx >= btn2X && mx <= btn2X + btnW && my >= btnY && my <= btnY + btnH) {
      quitToMainMenu(); return;
    }
    return;
  }

  // 8. Sanctum
  if (STATE === 'sanctum') {
    if (typeof handleSanctumClick === 'function') handleSanctumClick(mx, my);
    return;
  }

  // 9. Codex
  if (STATE === 'codex') {
    if (typeof handleCodexClick === 'function') handleCodexClick(mx, my);
    return;
  }

  // 10. Settings & Achievements
  if (STATE === 'settings') {
    const eb = drawSettings._editBtn, rb = drawSettings._resetBtn;
    if (eb && mx >= eb.x && mx <= eb.x + eb.w && my >= eb.y && my <= eb.y + eb.h) {
      if (CTRL_EDIT_MODE) exitCtrlEditMode(); else enterCtrlEditMode();
      return;
    }
    if (rb && mx >= rb.x && mx <= rb.x + rb.w && my >= rb.y && my <= rb.y + rb.h) {
      resetCtrlLayout(); return;
    }
    STATE = 'title'; SETTINGS_SLIDE = 0;
    return;
  }

  if (STATE === 'achievements') {
    STATE = 'title'; ACHIEV_SLIDE = 0; return;
  }

  if (STATE === 'titlecinematic') {
    TC_skip(); return;
  }

  if (STATE === 'cinematic') {
    ciAdvance(); return;
  }
});


function drawHUDWeaponSlots() {
  if (STATE !== 'playing') return;
  const hudSlotStartX = 200;
  const hudSlotY = LH - 44;
  const hudSlotW = 38;
  const hudSlotH = 36;
  const hudSlotGap = 6;

  for (let i = 0; i < 3; i++) {
    const sx = hudSlotStartX + i * (hudSlotW + hudSlotGap);
    const w = weaponSlots[i];
    const isActive = (i === activeWeaponSlot);

    CX.save();
    if (isActive) {
      CX.shadowColor = '#fde68a';
      CX.shadowBlur = 14;
      CX.fillStyle = 'rgba(201, 168, 76, 0.32)';
      CX.strokeStyle = '#fde68a';
      CX.lineWidth = 2.0;
    } else {
      CX.fillStyle = 'rgba(15, 23, 42, 0.85)';
      CX.strokeStyle = 'rgba(71, 85, 105, 0.45)';
      CX.lineWidth = 1.0;
    }
    roundRect(CX, sx, hudSlotY, hudSlotW, hudSlotH, 5);
    CX.fill(); CX.stroke();
    CX.shadowBlur = 0;

    CX.fillStyle = isActive ? '#fde68a' : '#64748b';
    CX.font = 'bold 8px Cinzel, serif';
    CX.textAlign = 'left'; CX.textBaseline = 'top';
    CX.fillText(String(i + 1), sx + 3, hudSlotY + 2);

    if (w) {
      CX.font = '16px serif';
      CX.textAlign = 'center'; CX.textBaseline = 'middle';
      CX.fillText(w.icon, sx + hudSlotW / 2, hudSlotY + hudSlotH / 2 + 2);
    } else {
      CX.fillStyle = '#475569';
      CX.font = '9px Cinzel, serif';
      CX.textAlign = 'center'; CX.textBaseline = 'middle';
      CX.fillText('—', sx + hudSlotW / 2, hudSlotY + hudSlotH / 2 + 2);
    }
    CX.restore();
  }
}
